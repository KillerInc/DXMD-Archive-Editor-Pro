name: Fix v0.7.11 Audit Workflow

on:
  push:
    paths:
      - '.github/workflows/fix-v0.7.11-workflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix regex replacement escaping
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/release-v0.7.11.yml')
          s=p.read_text()
          old='re.subn(pattern,replacement,s,count=1,flags=re.S)'
          new='re.subn(pattern,lambda m: replacement,s,count=1,flags=re.S)'
          count=s.count(old)
          if count < 1:
              raise SystemExit('No replacement calls found to patch')
          s=s.replace(old,new)
          p.write_text(s)
          print(f'Patched {count} replacement call(s)')
      - name: Commit workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-v0.7.11.yml
          git commit -m "Fix v0.7.11 workflow replacement escaping"
          git push
