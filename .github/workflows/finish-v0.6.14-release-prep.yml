name: Finish v0.6.14 release prep

on:
  push:
    paths:
      - '.github/workflows/finish-v0.6.14-release-prep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply final release prep
        run: python3 tools/finish_v0614_release.py

      - name: Build
        run: bash build.sh

      - name: Verify JAR
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.14.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^FieldConfidenceAudit.class$'
          jar tf "$JAR" | grep -q '^ArchiveContextResolver.class$'

      - name: Commit release prep
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/ArchiveContextResolver.java README.md RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Complete v0.6.14 audit release prep'
            git push origin HEAD:main
          fi
