name: Release v0.7.11 Final Audit Retry

on:
  push:
    paths:
      - '.github/workflows/release-v0.7.11-final2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reuse audited transform and correct regex literals
        shell: python
        run: |
          from pathlib import Path
          import re, textwrap
          wf=Path('.github/workflows/release-v0.7.11-final.yml').read_text()
          marker='      - name: Apply full audit fixes\n'
          start=wf.index(marker)
          run=wf.index('        run: |\n',start)+len('        run: |\n')
          end=wf.index('\n      - name: Build Java 21',run)
          lines=wf[run:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code,'v0711-audit-transform','exec'),{})

          # The previous workflow encoded Java regex escapes one layer too shallow.
          p=Path('src/main/java/FieldConfidenceAudit.java')
          s=p.read_text()
          pattern=r'    static String compactDisplayName\(Assessment a, String generatedLabel\) \{.*?\n    private static String compactFamilyStat\(String family, String label\) \{.*?\n    \}\n\n'
          fixed=r'''    static String compactDisplayName(Assessment a, String generatedLabel) {
        if (a == null) return "Unidentified";
        String name = a.name == null ? "" : a.name.trim();
        String family = weaponFamily(generatedLabel);
        String lower = name.toLowerCase(Locale.ROOT);
        if (family != null && (lower.contains("weapon stat") || lower.contains("upgrade parts cost"))) {
            String stat = compactFamilyStat(family, generatedLabel);
            return (lower.contains("upgrade parts cost") ? "Upgrade Cost - " : "Weapon Stat - ") + stat;
        }
        name = name.replace('—','-');
        name = name.replaceFirst("(?i)^(strong\\s+suspected|suspected|confirmed):\\s*", "");
        name = name.replace("Weapon Weapon Stat", "Weapon Stat");
        name = name.replace("Energy Auto-Regeneration", "Energy Auto-Regen");
        name = name.replace("Inventory Grid Width", "Inventory Width");
        name = name.replace("Inventory Grid Control", "Inventory Grid");
        name = name.replace("Magazine Capacity", "Magazine");
        name = name.replace("Takedown Power Consumption Control", "Takedown Power Consumption");
        name = name.replace("Standard-Reticle Function Slot / Silencer Override", "Reticle / Silencer Function");
        name = name.replace("Built-in Silencer Enable Toggle", "Silencer Toggle");
        name = name.replace("Bolt-Action Override Toggle", "Bolt-Action Toggle");
        name = name.replace("Experimental Augmentation Gate", "Experimental Aug Gate");
        name = name.replace("Health Regeneration Disable Component", "Health Regen - Disable");
        name = name.replace("Damage Reduction L1 Default-Enable Component", "Damage Reduction L1 - Default");
        name = name.replace("Suppressor Damage-Debuff Component", "Suppressor Debuff");
        name = name.replace("Suppressor Companion Field", "Suppressor Companion");
        name = name.replace("Damage-Penalty Control", "Damage Penalty");
        name = name.replace("Micro-Assembler Experimental/Overclock Gate", "Micro-Assembler Exp/Overclock");
        name = name.replace("Unresolved Tactical Field (contaminated Micro-Assembler archive)", "Unresolved Tactical Field");
        name = name.replace("Augmentation Attribute", "Augmentation");
        name = name.replaceAll("(?i)\\s+component\\s+\\d+\\b", "");
        name = name.replaceAll("(?i)\\s+series\\s+\\d+\\b", "");
        name = name.replaceAll("\\s+-\\s+", " - ");
        return name.replaceAll("\\s{2,}", " ").trim();
    }

    private static String compactFamilyStat(String family, String label) {
        String u = cleanGeneratedLabel(label).toUpperCase(Locale.ROOT).replace(' ', '_');
        if (family.equals("Accuracy") && u.contains("ACCURACY_02")) return "Spread";
        if (family.equals("Silencer")) return "Suppressor";
        return family;
    }

'''
          s,n=re.subn(pattern,lambda m:fixed,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not repair compact display method')
          p.write_text(s)

      - name: Build Java 21
        run: bash build.sh

      - name: Java 21 lint audit
        shell: bash
        run: |
          rm -rf build/lint && mkdir -p build/lint
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 21 -encoding UTF-8 -Xlint:all -d build/lint

      - name: Run audit regressions
        shell: bash
        run: |
          cat > build/V0711Audit.java <<'JAVA'
          import java.io.*;
          import java.lang.reflect.*;
          import java.nio.file.*;
          import javax.swing.*;
          import options.*;
          public class V0711Audit {
            static void check(boolean v,String m){if(!v)throw new RuntimeException(m);}
            public static void main(String[] args) throws Exception {
              check(BaseResearchProfiles.get().fields.size()==2546,"Base row count");
              int dlc=0; for(String n:DLCProfiles.names()) dlc+=DLCProfiles.get(n).fields.size(); check(dlc==350,"DLC row count");
              check(LogicalResourceCatalog.mappingCount()==10,"HeaderLib mapping count");
              ResearchInspectorPanel panel=new ResearchInspectorPanel();
              Field tf=ResearchInspectorPanel.class.getDeclaredField("table"); tf.setAccessible(true); JTable t=(JTable)tf.get(panel);
              check(t.getColumnCount()==3,"Research columns");
              check("Status".equals(t.getColumnName(0))&&"Attribute".equals(t.getColumnName(1))&&"User ID".equals(t.getColumnName(2)),"Column names");
              var a=new FieldConfidenceAudit.Assessment(FieldConfidenceAudit.Confidence.SUSPECTED,"Suspected: Weapon Weapon Stat — Accuracy 02 component 3","",false);
              check("Weapon Stat - Spread".equals(FieldConfidenceAudit.compactDisplayName(a,"ACCURACY_02 component 3")),"compact label");
              Method parse=ResearchInspectorPanel.class.getDeclaredMethod("parseEditBytes",String.class,String.class,int.class); parse.setAccessible(true);
              byte[] max=(byte[])parse.invoke(panel,"Unsigned integer (LE)","18446744073709551615",8); check(max.length==8,"U64 width"); for(byte b:max)check((b&255)==255,"U64 max");
              Path tmp=Files.createTempFile("dxmd-bool-audit",".bin"); Files.write(tmp,new byte[]{2});
              BooleanOption bo=new BooleanOption(new java.util.ArrayList<>(java.util.List.of(0L)),new java.util.ArrayList<>(java.util.List.of((short)0)),new java.util.ArrayList<>(java.util.List.of((short)1)),"Audit Bool","",false);
              boolean rejected=false; try{FileAnalyzer.analyze(tmp.toFile(),new java.util.ArrayList<>(java.util.List.of(bo)));}catch(IOException ex){rejected=true;} finally{Files.deleteIfExists(tmp);} check(rejected,"strict boolean");
              System.out.println("v0.7.11 audit regressions OK: Base=2546 DLC=350 U64 strict-boolean UI");
            }
          }
          JAVA
          javac --release 21 -cp build/classes -d build/classes build/V0711Audit.java
          java -Djava.awt.headless=true -cp build/classes V0711Audit
          javap -verbose -classpath build/classes Launcher | grep -q 'major version: 65'
          jar tf dist/DXMD-Archive-Editor-Pro-v0.7.11.jar | grep -q '^ResearchInspectorPanel.class$'

      - name: Package ZIP and checksums
        shell: bash
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.7.11.jar'
          HASH="$(sha256sum "$JAR" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'DXMD-Archive-Editor-Pro-v0.7.11.jar' > dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256
          rm -rf build/release-package && mkdir -p build/release-package
          cp "$JAR" dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256 CODE_AUDIT_v0.7.11.md build/release-package/
          printf '%s\n' 'DXMD Archive Editor Pro v0.7.11' 'Java 21 or newer required.' '' 'Windows verification:' '  certutil -hashfile DXMD-Archive-Editor-Pro-v0.7.11.jar SHA256' > build/release-package/VERIFY.txt
          (cd build/release-package && zip -9 ../../dist/DXMD-Archive-Editor-Pro-v0.7.11.zip DXMD-Archive-Editor-Pro-v0.7.11.jar DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256 VERIFY.txt CODE_AUDIT_v0.7.11.md)
          sha256sum dist/DXMD-Archive-Editor-Pro-v0.7.11.jar
          sha256sum dist/DXMD-Archive-Editor-Pro-v0.7.11.zip

      - name: Commit audited source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java build.sh build.bat README.md RELEASE_NOTES.md CODE_AUDIT_v0.7.11.md
          git commit -m "Complete v0.7.11 code and UI text audit"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXMD-Archive-Editor-Pro-v0.7.11
          path: |
            dist/DXMD-Archive-Editor-Pro-v0.7.11.zip
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256
            CODE_AUDIT_v0.7.11.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.11
          name: DXMD Archive Editor Pro v0.7.11
          body_path: RELEASE_NOTES.md
          files: |
            dist/DXMD-Archive-Editor-Pro-v0.7.11.zip
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256
            CODE_AUDIT_v0.7.11.md
