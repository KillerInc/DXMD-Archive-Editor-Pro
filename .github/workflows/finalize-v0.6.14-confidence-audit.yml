name: Finalize v0.6.14 confidence audit

on:
  push:
    paths:
      - '.github/workflows/finalize-v0.6.14-confidence-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply final audit fixes
        run: python3 tools/finalize_v0614_confidence_audit.py

      - name: Build audited JAR
        run: bash build.sh

      - name: Smoke-check audit integration
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.14.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^FieldConfidenceAudit.class$'
          jar tf "$JAR" | grep -q '^ArchiveContextResolver.class$'
          jar tf "$JAR" | grep -q '^DLCArchiveContextResolver.class$'
          jar tf "$JAR" | grep -q '^FieldIdentificationIO.class$'

      - name: Commit final audit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java README.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Finalize v0.6.14 confidence audit'
            git push origin HEAD:main
          fi
