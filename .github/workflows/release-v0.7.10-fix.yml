name: Release v0.7.10 Concise Attribute Labels Fix

on:
  push:
    paths:
      - '.github/workflows/release-v0.7.10-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Shorten Base and DLC research attribute labels
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/FieldConfidenceAudit.java')
          s=p.read_text()
          marker='''    static String dlcEvidence(String profileName, DLCProfiles.Field f, String context) {\n'''
          helper='''    static String compactDisplayName(Assessment a, String generatedLabel) {\n        if (a==null) return "Unidentified";\n        String name=a.name==null?"":a.name.trim();\n        String family=weaponFamily(generatedLabel);\n        String lower=name.toLowerCase(Locale.ROOT);\n        if (family!=null && (lower.contains("weapon stat") || lower.contains("upgrade parts cost"))) {\n            String prefix=switch(a.confidence) {\n                case STRONG_SUSPECTED -> "Strong Suspected: ";\n                case SUSPECTED -> "Suspected: ";\n                case CONFIRMED -> "Confirmed: ";\n                case UNIDENTIFIED -> "Unidentified: ";\n            };\n            String stat=compactFamilyStat(family,generatedLabel);\n            if (lower.contains("upgrade parts cost")) return prefix+"Upgrade Cost - "+stat;\n            return prefix+"Weapon Stat - "+stat;\n        }\n        name=name.replace('—','-');\n        name=name.replace("Weapon Weapon Stat","Weapon Stat");\n        name=name.replace("Inventory Grid Control","Inventory Grid");\n        name=name.replace("Damage-Penalty Control","Damage Penalty");\n        name=name.replace("Suppressor Companion Field","Suppressor Companion");\n        name=name.replace("Augmentation Attribute","Augmentation");\n        name=name.replaceAll("(?i)\\\\s+component\\\\s+\\\\d+\\\\b","");\n        name=name.replaceAll("(?i)\\\\s+series\\\\s+\\\\d+\\\\b","");\n        name=name.replaceAll("\\\\s+-\\\\s+"," - ");\n        name=name.replaceAll("\\\\s{2,}"," ").trim();\n        return name;\n    }\n\n    private static String compactFamilyStat(String family, String label) {\n        String u=cleanGeneratedLabel(label).toUpperCase(Locale.ROOT).replace(' ','_');\n        if (family.equals("Accuracy") && u.contains("ACCURACY_02")) return "Spread";\n        if (family.equals("Silencer")) return "Suppressor";\n        return family;\n    }\n\n'''
          if helper not in s:
              if marker not in s: raise SystemExit('FieldConfidenceAudit insertion point not found')
              s=s.replace(marker,helper+marker)
          p.write_text(s)

          p=Path('src/main/java/ResearchInspectorPanel.java')
          s=p.read_text()
          old='''    private String displayName(Row row) { return assessment(row).name; }'''
          new='''    private String displayName(Row row) {\n        return FieldConfidenceAudit.compactDisplayName(assessment(row), row.label);\n    }'''
          if old not in s: raise SystemExit('ResearchInspectorPanel displayName method not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/main/java/Launcher.java'); s=p.read_text().replace('DXMD Archive Editor Pro v0.7.9','DXMD Archive Editor Pro v0.7.10'); p.write_text(s)
          for name in ('build.sh','build.bat'):
              p=Path(name); s=p.read_text().replace('DXMD-Archive-Editor-Pro-v0.7.9.jar','DXMD-Archive-Editor-Pro-v0.7.10.jar'); p.write_text(s)
          p=Path('README.md'); s=p.read_text()
          s=s.replace('> **Current version:** v0.7.9', '> **Current version:** v0.7.10')
          s=s.replace('dist/DXMD-Archive-Editor-Pro-v0.7.9.jar','dist/DXMD-Archive-Editor-Pro-v0.7.10.jar')
          anchor='## v0.7.9 comparison evidence alignment\n'
          section='''## v0.7.10 concise research attributes\n\nThe Research Inspector **Attribute** column now uses concise display labels for Base and all five DLC packs. Generated weapon-family noise such as numbered series/components is removed from the list while the full confidence name and evidence remain available in the right-side inspector. For example, `ACCURACY_02` is shown as **Suspected: Weapon Stat - Spread**. Other generated families collapse to compact labels such as Damage, Recoil, Rate of Fire, Reload Speed, Scope, Suppressor, and Upgrade Cost. Curated Component A/B names remain intact where they distinguish real paired controls.\n\n'''
          if section not in s: s=s.replace(anchor,section+anchor)
          p.write_text(s)
          Path('RELEASE_NOTES.md').write_text('''# DXMD Archive Editor Pro v0.7.10\n\n## Concise Research Inspector attributes\n\n- Shortens the left-side **Attribute** text without removing underlying research metadata.\n- Applies the same compact naming policy to **Base and all five DLC packs**.\n- Generated weapon-stat series/component noise is collapsed to concise labels.\n- `ACCURACY_02` displays as **Suspected: Weapon Stat - Spread**.\n- Similar families display as Damage, Recoil, Rate of Fire, Ammo Capacity, Reload Speed, Scope, Suppressor, etc.\n- Strong upgrade-cost candidates display as **Strong Suspected: Upgrade Cost - <family>**.\n- Curated Component A/B names are preserved where they identify distinct paired controls.\n- Full original assessment names and evidence remain in the right-side inspector.\n\nJava 21 or newer remains required.\n''')

      - name: Build Java 21
        run: bash build.sh

      - name: Test concise Base and DLC names
        shell: bash
        run: |
          cat > build/V0710NameSanity.java <<'JAVA'
          public class V0710NameSanity {
            private static void eq(String got,String expected) {
              if(!expected.equals(got)) throw new RuntimeException("Expected ["+expected+"] got ["+got+"]");
            }
            private static boolean generatedCompact(String s) {
              return s.contains("Weapon Stat - ") || s.contains("Upgrade Cost - ");
            }
            public static void main(String[] args) throws Exception {
              var suspected=new FieldConfidenceAudit.Assessment(
                FieldConfidenceAudit.Confidence.SUSPECTED,
                "Suspected: Weapon Weapon Stat — Accuracy 02 component 3","",false);
              eq(FieldConfidenceAudit.compactDisplayName(suspected,"ACCURACY_02 component 3"),
                 "Suspected: Weapon Stat - Spread");
              var dlc=new FieldConfidenceAudit.Assessment(
                FieldConfidenceAudit.Confidence.SUSPECTED,
                "Suspected: Elite Combat Rifle Weapon Stat — RECOIL_03 component 2","",false);
              eq(FieldConfidenceAudit.compactDisplayName(dlc,"RECOIL_03 component 2"),
                 "Suspected: Weapon Stat - Recoil");
              var cost=new FieldConfidenceAudit.Assessment(
                FieldConfidenceAudit.Confidence.STRONG_SUSPECTED,
                "Strong suspected: Elite Battle Rifle Damage Upgrade Parts Cost — series 2 component 1","",false);
              eq(FieldConfidenceAudit.compactDisplayName(cost,"DAMAGE_02 component 1"),
                 "Strong Suspected: Upgrade Cost - Damage");

              int baseCompact=0, dlcCompact=0;
              for (BaseResearchProfiles.Field f:BaseResearchProfiles.get().fields) {
                if(FieldConfidenceAudit.weaponFamily(f.label)==null) continue;
                String shown=FieldConfidenceAudit.compactDisplayName(FieldConfidenceAudit.assessBase(f,null,""),f.label);
                if(generatedCompact(shown)) {
                  if(shown.toLowerCase().contains("component") || shown.toLowerCase().contains("series"))
                    throw new RuntimeException("Base generated noise remains: "+shown);
                  baseCompact++;
                }
              }
              for(String profile:DLCProfiles.names()) for(DLCProfiles.Field f:DLCProfiles.get(profile).fields) {
                if(FieldConfidenceAudit.weaponFamily(f.label)==null) continue;
                String shown=FieldConfidenceAudit.compactDisplayName(FieldConfidenceAudit.assessDlc(profile,f,""),f.label);
                if(generatedCompact(shown)) {
                  if(shown.toLowerCase().contains("component") || shown.toLowerCase().contains("series"))
                    throw new RuntimeException("DLC generated noise remains: "+profile+" / "+shown);
                  dlcCompact++;
                }
              }
              if(baseCompact==0 || dlcCompact==0) throw new RuntimeException("Compact Base/DLC coverage test did not run");
              if(LogicalResourceCatalog.mappingCount()!=10) throw new RuntimeException("Logical mappings changed");
              System.out.println("v0.7.10 concise labels OK: base="+baseCompact+" dlc="+dlcCompact);
            }
          }
          JAVA
          javac --release 21 -cp build/classes -d build/classes build/V0710NameSanity.java
          java -Djava.awt.headless=true -cp build/classes V0710NameSanity
          javap -verbose -classpath build/classes Launcher | grep -q 'major version: 65'
          jar tf dist/DXMD-Archive-Editor-Pro-v0.7.10.jar | grep -q '^ResearchInspectorPanel.class$'

      - name: Package preferred ZIP and checksums
        shell: bash
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.7.10.jar'
          HASH="$(sha256sum "$JAR" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'DXMD-Archive-Editor-Pro-v0.7.10.jar' > dist/DXMD-Archive-Editor-Pro-v0.7.10.jar.sha256
          rm -rf build/release-package
          mkdir -p build/release-package
          cp "$JAR" dist/DXMD-Archive-Editor-Pro-v0.7.10.jar.sha256 build/release-package/
          cat > build/release-package/VERIFY.txt <<'TXT'
          DXMD Archive Editor Pro v0.7.10 - verification
          Java 21 or newer required.

          Windows SHA-256 verification:
            certutil -hashfile DXMD-Archive-Editor-Pro-v0.7.10.jar SHA256
          TXT
          (cd build/release-package && zip -9 ../../dist/DXMD-Archive-Editor-Pro-v0.7.10.zip DXMD-Archive-Editor-Pro-v0.7.10.jar DXMD-Archive-Editor-Pro-v0.7.10.jar.sha256 VERIFY.txt)
          sha256sum dist/DXMD-Archive-Editor-Pro-v0.7.10.jar
          sha256sum dist/DXMD-Archive-Editor-Pro-v0.7.10.zip

      - name: Commit source and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/FieldConfidenceAudit.java src/main/java/ResearchInspectorPanel.java src/main/java/Launcher.java build.sh build.bat README.md RELEASE_NOTES.md
          git commit -m "Shorten Base and DLC research attribute labels"
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXMD-Archive-Editor-Pro-v0.7.10
          path: |
            dist/DXMD-Archive-Editor-Pro-v0.7.10.zip
            dist/DXMD-Archive-Editor-Pro-v0.7.10.jar
            dist/DXMD-Archive-Editor-Pro-v0.7.10.jar.sha256

      - name: Create v0.7.10 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.10
          name: DXMD Archive Editor Pro v0.7.10
          body_path: RELEASE_NOTES.md
          files: |
            dist/DXMD-Archive-Editor-Pro-v0.7.10.zip
            dist/DXMD-Archive-Editor-Pro-v0.7.10.jar
            dist/DXMD-Archive-Editor-Pro-v0.7.10.jar.sha256
