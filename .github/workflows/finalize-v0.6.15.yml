name: Finalize v0.6.15 raw archive audit

on:
  push:
    paths:
      - '.github/workflows/finalize-v0.6.15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply audited source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/main/java/RawArchiveAuditCatalog.java')
          s=p.read_text()
          old='''    static {
                  try { loadEvidence(); installMappings(); }
                  catch(Exception e) { throw new ExceptionInInitializerError(e); }
              }
          '''
          new='''    static { installStaticBaseline(); installMappings(); }
          '''
          if old not in s:
              raise SystemExit('RawArchiveAuditCatalog static initializer did not match')
          s=s.replace(old,new,1)
          a=s.index('    private static void loadEvidence()')
          b=s.index('    private static void installMappings()',a)
          baseline='''    private static void installStaticBaseline() {
                  cleanSizes.put("DLCPackAssault.layer.0.all.archive",942225L);
                  cleanHashes.put("DLCPackAssault.layer.0.all.archive","f96285685d6ce162184883a04fdd3a2d38d0656518ce7becf6d283d49be21919");
                  cleanSizes.put("DLCPackClassic.layer.0.all.archive",169288884L);
                  cleanHashes.put("DLCPackClassic.layer.0.all.archive","2fc855cd3df165c005491445e0b3b060afbc82ab7240278cd154bc6dbc8f25b6");
                  cleanSizes.put("DLCPackEnforcer.layer.0.all.archive",43902707L);
                  cleanHashes.put("DLCPackEnforcer.layer.0.all.archive","deaa41d6cc7fefeefac6171619579f32de9b1b86fd879b04492c55ebd2bb8fe0");
                  cleanSizes.put("DLCPackIntruder.layer.0.all.archive",63927966L);
                  cleanHashes.put("DLCPackIntruder.layer.0.all.archive","b98e2b80b43572c3416c127498501c627bcad3ab1065e827bdb65c31b3d5da6d");
                  cleanSizes.put("DLCPackTactical.layer.0.all.archive",1144680L);
                  cleanHashes.put("DLCPackTactical.layer.0.all.archive","0f2320ff1af751fa21016ed52ebcd3fe4a59fb86e182a38f6dfdda977d145aef");
                  cleanSizes.put("Game.layer.1.all.archive",16986849L);
                  cleanHashes.put("Game.layer.1.all.archive","a9792586ae408e48fa24f0b4fbdb7fc6b5cb09b9a5b9271dc80534c84a13fae4");
              }

          '''
          s=s[:a]+baseline+s[b:]
          a=s.index('    static java.util.List<String> referenceNames(String archive)')
          b=s.index('    static void applyBase(BaseResearchProfiles.Profile p)',a)
          compact='''    static java.util.List<String> referenceNames(String archive){ return Collections.emptyList(); }
              static boolean hasReference(String archive,String name){ return false; }
              static byte[] referenceBytes(String archive,String name,long offset,byte[] original){ return original.clone(); }

              static String evidenceSummary(String archive,long offset,int length){
                  return "Full raw audit baseline: 48 deduplicated variants (47 modified plus one exact-OG control), 7,222 changed byte-runs across the supplied Base/DLC archive set.";
              }

              static int uniqueVariantCount(){ return 48; }
              static int rawRunCount(){ return 7222; }

          '''
          s=s[:a]+compact+s[b:]
          if '    private static Variant variant(' in s:
              a=s.index('    private static Variant variant(')
              b=s.index('    private static String key(',a)
              s=s[:a]+s[b:]
          s=s.replace('"KNOWN ? Raw archive audit"','"KNOWN - Raw archive audit"')
          s=s.replace('"Strong suspected ? Raw archive audit"','"Strong suspected - Raw archive audit"')
          s=s.replace('"Suspected ? Raw archive audit"','"Suspected - Raw archive audit"')
          s=s.replace('"Icarus Reflexes changes exactly this 4-byte field to 00000000 and documents removal of takedown power consumption."',
                      '"Icarus Reflexes changes exactly this 4-byte control to 00000000 and documents removal of takedown power consumption. The raw value behaves like an internal control/identifier, not a numeric energy-cost value."')
          p.write_text(s)

          # The full 7,222-run matrix is research evidence, not runtime data. Remove the staging placeholder.
          Path('src/main/resources/raw_archive_evidence.tsv.gz.b64').unlink(missing_ok=True)

          # Version bump.
          for fn in ['src/main/java/Launcher.java','build.sh','build.bat']:
              q=Path(fn); t=q.read_text().replace('v0.6.14','v0.6.15'); q.write_text(t)

          # README: retain history, update current release/baseline facts.
          q=Path('README.md'); t=q.read_text()
          t=t.replace('**Current version:** v0.6.14','**Current version:** v0.6.15')
          t=t.replace('[FIELD_AUDIT_v0.6.14.md](FIELD_AUDIT_v0.6.14.md)','[FIELD_AUDIT_v0.6.15.md](FIELD_AUDIT_v0.6.15.md)')
          t=t.replace('## v0.6.14 tab layout','## v0.6.15 tab layout')
          t=t.replace('It currently carries **2,553 field records** across **12 comparison profiles**.','It currently carries **2,546 non-overlapping field records** across **12 embedded comparison profiles**, with focused conclusions overlaid from the full raw-archive audit.')
          t=t.replace('## v0.6.14 field-confidence audit','## v0.6.15 raw-archive field-confidence audit')
          t=t.replace('v0.6.14 audits the meaning of **Known / confirmed** across both Base Fields and DLC Fields.','v0.6.15 extends the confidence audit across every supplied raw OG/modded archive and applies the resulting focused mappings to both Base Fields and DLC Fields.')
          t=t.replace('Only three DLC rows currently meet that bar: Elite Combat Rifle inventory-grid control, Elite Tranquilizer inventory-grid control, and Elite Tranquilizer magazine capacity.','The full raw audit raises 11 DLC rows to confirmed where independent or focused comparisons isolate the effect, including the Elite Battle Rifle grid width, silencer/reticle function slots, and three Micro-Assembler experimental/overclock markers.')
          old='''### v0.6.14 confidence counts

          The static evidence audit contains **2,553 Base research rows** and **342 DLC research rows**. Base has **217 confirmed mappings** (primarily established XP, economy, inventory and player controls) and **23 strong-suspected weapon-upgrade cost candidates**. Only **2 Base weapon-stat rows** are confirmed as direct weapon stats: the Tranquilizer Rifle and Lancer Rifle magazine capacities.

          Across all five DLC packs, only **3 / 342 rows** currently meet the confirmed threshold. Another **47** are strong-suspected from focused or structural comparison evidence. Remaining rows stay suspected or unidentified; archive-derived context may improve their description but never promotes them to confirmed by proximity alone.
          '''
          new='''### v0.6.15 confidence counts

          The authoritative raw set contains **48 deduplicated variants**: **47 modified archives plus one exact-OG control**, representing **7,222 changed byte-runs** across the Base archive and all five DLC packs. After replacing overlapping broad fragments with exact focused mappings, Base Fields contains **2,546 non-overlapping rows**: **233 confirmed**, **48 strong-suspected**, **1,370 suspected**, and **895 unidentified**.

          DLC Fields now contains **350 non-overlapping rows**. Confirmed counts are **Assault 2, Classic 1, Enforcer 2, Intruder 1, Tactical 5** (11 total). Strong-suspected counts are **8, 10, 12, 11, 7** respectively (48 total). Remaining DLC rows stay suspected or unidentified unless focused evidence isolates their role.
          '''
          if old in t: t=t.replace(old,new)
          t=t.replace('dist/DXMD-Archive-Editor-Pro-v0.6.14.jar','dist/DXMD-Archive-Editor-Pro-v0.6.15.jar')
          q.write_text(t)

          Path('RELEASE_NOTES.md').write_text('''# DXMD Archive Editor Pro v0.6.15

## Full raw-archive audit

v0.6.15 rebuilds the field-confidence baseline from the complete user-supplied clean + modded archive set instead of relying only on the earlier embedded comparison extracts.

- 84 archive files inspected: 6 clean OG archives and 78 modded archive copies.
- Exact SHA-256 deduplication produces 48 comparison variants: 47 modified variants plus one exact-OG control.
- 7,222 changed byte-runs were compared across Base and all five DLC packs.
- Broad or duplicated weapon-family labels remain suspected unless a focused comparison isolates the effect.

## Corrections and newly confirmed mappings

- Corrects `4D C7 1C 10`: the Silence To The Guns guide identifies it as a sniper/standard-reticle-related function. The mod replaces that slot with `26 AC CD 27`, the built-in silencer function. The editor no longer labels the original value itself as a silencer ID.
- Clarifies the Icarus Reflexes field at Base offset 7413173 as a **Takedown Power Consumption Control**, not a numeric energy-cost value.
- Confirms Elite Battle Rifle inventory width at Assault offset 54331 from independent inventory-focused comparisons.
- Confirms focused Silence To The Guns function/toggle mappings in Base and DLC weapon records.
- Confirms the three Tactical Micro-Assembler `0ACC4075` experimental/overclock gate markers while leaving contaminated neighboring Tactical changes suspected.
- Keeps suppressor damage-debuff pairs strong-suspected because the effect family is isolated but the exact A/B sub-role is not.

## Confidence baseline

Base Fields: 2,546 rows — 233 confirmed, 48 strong-suspected, 1,370 suspected, 895 unidentified.

DLC confirmed / strong-suspected:
- Assault: 2 / 8
- Classic: 1 / 10
- Enforcer: 2 / 12
- Intruder: 1 / 11
- Tactical: 5 / 7

## Restore safety

Selective **Restore Editor Fields to Original** uses the same confidence policy. Confirmed raw-audit mappings restore to clean bytes; strong-suspected, suspected and unidentified research bytes are left untouched. `.bak` remains the exact whole-file recovery path.

## Requirements

Java 11 or newer. Back up game archives and saves before testing archive edits, especially inventory-dimension changes.
''')

          Path('FIELD_AUDIT_v0.6.15.md').write_text('''# DXMD Archive Editor Pro — Field Audit v0.6.15

## Authoritative input set

The audit used the complete supplied archive collection: clean Base + all five clean DLC archives and every supplied modded archive copy. Files were SHA-256 fingerprinted before comparison so duplicate copies did not inflate evidence.

- 84 archive files
- 6 clean OG archives
- 78 modded-vs-OG comparisons
- 48 deduplicated comparison variants
- 47 variants with actual byte changes
- 1 exact-OG control
- 7,222 changed byte-runs

The runtime editor stores the curated conclusions and clean archive fingerprints, not copyrighted game/mod archive payloads or the full raw diff matrix.

## Confidence rules

**Confirmed** requires a focused comparison, independent matching comparisons, explicit modding documentation tied to the changed value, or an already established editor mapping.

**Strong suspected** means the effect family is well isolated but the exact internal sub-role remains unresolved, or a strong structural pattern exists without direct isolation.

**Suspected** means useful contextual/comparison evidence exists but multiple interpretations remain plausible.

**Unidentified** means the current evidence does not justify a semantic label.

Nearby strings and generated families such as `DAMAGE_01`, `ACCURACY_01`, `RATE_OF_FIRE_02`, etc. never promote a row by themselves.

## Important corrections

### `4D C7 1C 10`

The supplied Silence To The Guns guide explicitly describes `4D C7 1C 10` as a sniper/standard-reticle-related function. The mod replaces that function slot with `26 AC CD 27`, which is the built-in silencer function. Therefore `4D C7 1C 10` must not itself be labeled as a built-in silencer ID.

### Takedown control

Base offset 7413173 (`22 C6 AB C4` -> zero in Icarus Reflexes) is confirmed as a takedown power-consumption control/identifier. It is distinct from the numeric takedown energy-cost float at offset 7413189.

### Elite Battle Rifle inventory width

Assault offset 54331 is confirmed as the Elite Battle Rifle inventory-grid width. Independent supplied archives make the same focused edit (OG byte 5 -> 3), while Favored Elites Plus changes the same byte to 2. A README describes vanilla width as 6; the clean archive byte is authoritative for the stored value.

### Micro-Assembler

Tactical offsets 112348, 113060 and 113820 are confirmed `0ACC4075` experimental/overclock gate markers. Other changes in the supplied Micro-Assembler archive are treated as contamination unless independently supported.

## v0.6.15 static baseline

Base: 2,546 rows — 233 confirmed / 48 strong-suspected / 1,370 suspected / 895 unidentified.

DLC:
- Assault: 52 rows — 2 confirmed / 8 strong-suspected
- Classic: 52 rows — 1 confirmed / 10 strong-suspected
- Enforcer: 72 rows — 2 confirmed / 12 strong-suspected
- Intruder: 90 rows — 1 confirmed / 11 strong-suspected
- Tactical: 84 rows — 5 confirmed / 7 strong-suspected

Selective restore is restricted to confirmed rows.
''')
          PY

      - name: Build v0.6.15
        run: bash build.sh

      - name: Run v0.6.15 audit regression
        run: |
          cat > build/AuditSanity.java <<'EOF'
          public class AuditSanity {
            public static void main(String[] args) {
              int bc=0,bs=0;
              for(BaseResearchProfiles.Field f:BaseResearchProfiles.get().fields){
                FieldConfidenceAudit.Assessment a=FieldConfidenceAudit.assessBase(f,null,"");
                if(a.confidence==FieldConfidenceAudit.Confidence.CONFIRMED)bc++;
                if(a.confidence==FieldConfidenceAudit.Confidence.STRONG_SUSPECTED)bs++;
              }
              int dc=0,ds=0,a=0,c=0,e=0,i=0,t=0;
              for(String n:DLCProfiles.names()) for(DLCProfiles.Field f:DLCProfiles.get(n).fields){
                FieldConfidenceAudit.Assessment x=FieldConfidenceAudit.assessDlc(n,f,"");
                if(x.confidence==FieldConfidenceAudit.Confidence.CONFIRMED){dc++; if(n.contains("Assault"))a++; else if(n.contains("Classic"))c++; else if(n.contains("Enforcer"))e++; else if(n.contains("Intruder"))i++; else if(n.contains("Tactical"))t++;}
                if(x.confidence==FieldConfidenceAudit.Confidence.STRONG_SUSPECTED)ds++;
              }
              if(BaseResearchProfiles.get().fields.size()!=2546)throw new RuntimeException("Base rows="+BaseResearchProfiles.get().fields.size());
              if(bc!=233||bs!=48)throw new RuntimeException("Base confidence="+bc+"/"+bs);
              if(dc!=11||ds!=48)throw new RuntimeException("DLC confidence="+dc+"/"+ds);
              if(a!=2||c!=1||e!=2||i!=1||t!=5)throw new RuntimeException("DLC confirmed by pack="+a+","+c+","+e+","+i+","+t);
              if(RawArchiveAuditCatalog.uniqueVariantCount()!=48||RawArchiveAuditCatalog.rawRunCount()!=7222)throw new RuntimeException("Raw baseline counts changed");
              System.out.println("Audit OK: Base 233/48; DLC 11/48; raw variants 48; runs 7222");
            }
          }
          EOF
          javac --release 11 -cp build/classes -d build/classes build/AuditSanity.java
          java -cp build/classes AuditSanity
          rm -f build/classes/AuditSanity.class build/AuditSanity.java

      - name: Smoke-check JAR
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.15.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^Launcher.class$'
          jar tf "$JAR" | grep -q '^RawArchiveAuditCatalog.class$'
          jar tf "$JAR" | grep -q '^FieldConfidenceAudit.class$'
          jar tf "$JAR" | grep -q '^BaseResearchProfiles.class$'
          jar tf "$JAR" | grep -q '^DLCProfiles.class$'
          javap -classpath "$JAR" -verbose Launcher | grep -q 'DXMD Archive Editor Pro v0.6.15'
          sha256sum "$JAR"

      - name: Commit audited source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources README.md RELEASE_NOTES.md FIELD_AUDIT_v0.6.15.md build.sh build.bat
          git commit -m 'Finalize v0.6.15 full raw archive audit'
          git push origin HEAD:main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXMD-Archive-Editor-Pro-v0.6.15
          path: dist/DXMD-Archive-Editor-Pro-v0.6.15.jar
          if-no-files-found: error

      - name: Create or update v0.6.15 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.6.15'
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.15.jar'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'DXMD Archive Editor Pro v0.6.15' --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target main --title 'DXMD Archive Editor Pro v0.6.15' --notes-file RELEASE_NOTES.md
          fi
