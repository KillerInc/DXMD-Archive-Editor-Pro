name: Research Reconciliation Audit

on:
  push:
    paths:
      - '.github/workflows/research-reconcile.yml'
      - 'research_reconcile.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile verified paragraph ownership
        run: python research_reconcile.py
      - name: Commit reconciliation report
        shell: bash
        run: |
          if git diff --quiet -- RESEARCH_RECONCILIATION.txt && git ls-files --error-unmatch RESEARCH_RECONCILIATION.txt >/dev/null 2>&1; then
            echo "No report change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESEARCH_RECONCILIATION.txt
          git commit -m "Generate boundary-safe DXMD reconciliation report"
          git push
