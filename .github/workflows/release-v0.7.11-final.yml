name: Release v0.7.11 Final Audit

on:
  push:
    paths:
      - '.github/workflows/release-v0.7.11-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply full audit fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def repl(s, old, new, label):
              if old not in s: raise SystemExit('Missing target: '+label)
              return s.replace(old,new)

          # 1) Stream context scans instead of allocating entire archives.
          for path, cls in [('src/main/java/ArchiveContextResolver.java','ArchiveContextResolver'),
                            ('src/main/java/DLCArchiveContextResolver.java','DLCArchiveContextResolver')]:
              s=read(path)
              s=s.replace('import java.nio.charset.StandardCharsets;\n','').replace('import java.nio.file.Files;\n','')
              s=repl(s, f'''    private {cls}(byte[] bytes) {{\n        scan(bytes);\n        buildBlocks();\n    }}''',
                       f'''    private {cls}(File archive) throws IOException {{\n        scan(archive);\n        buildBlocks();\n    }}''', path+' ctor')
              s=repl(s, f'new {cls}(Files.readAllBytes(archive.toPath()))', f'new {cls}(archive)', path+' cache')
              pattern=r'    private void scan\(byte\[\] bytes\) \{.*?\n    \}\n\n    private void buildBlocks\(\) \{'
              replacement='''    private void scan(File archive) throws IOException {\n        for (ArchiveTextScanner.Token raw : ArchiveTextScanner.scan(archive)) {\n            String text = raw.text();\n            if (isReadable(text)) readable.add(new Token(raw.start(), raw.end(), text));\n        }\n    }\n\n    private void buildBlocks() {'''
              s,n=re.subn(pattern,lambda m:replacement,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('scan replacement failed: '+path)
              s=s.replace('Base Fields rows','Base research rows').replace('DLC Fields rows','DLC research rows')
              write(path,s)

          # 2) Theme must preserve deliberately monospaced byte views.
          p='src/main/java/UiTheme.java'; s=read(p)
          old='''        c.setFont(new Font("Segoe UI", c.getFont() == null ? Font.PLAIN : c.getFont().getStyle(),\n                Math.max(12, c.getFont() == null ? 13 : c.getFont().getSize())));'''
          new='''        Font oldFont = c.getFont();\n        String oldName = oldFont == null ? "" : oldFont.getName().toLowerCase(java.util.Locale.ROOT);\n        boolean keepMono = oldName.contains("mono") || oldName.contains("courier");\n        c.setFont(new Font(keepMono ? Font.MONOSPACED : "Segoe UI",\n                oldFont == null ? Font.PLAIN : oldFont.getStyle(),\n                Math.max(12, oldFont == null ? 13 : oldFont.getSize())));'''
          s=repl(s,old,new,'UiTheme font')
          write(p,s)

          # 3) Strict boolean decode: unexpected bytes are not silently treated as true.
          p='src/main/java/FileAnalyzer.java'; s=read(p)
          old='''    private static boolean readLogicalBoolean(RandomAccessFile file, BooleanOption option, int index) throws IOException {\n        int raw = readU8(file, option.getAddresses().get(index));\n        return raw != (option.getSpecificValueFalseVals(index) & 0xFF);\n    }'''
          new='''    private static boolean readLogicalBoolean(RandomAccessFile file, BooleanOption option, int index) throws IOException {\n        long address = option.getAddresses().get(index);\n        int raw = readU8(file, address);\n        int falseValue = option.getSpecificValueFalseVals(index) & 0xFF;\n        int trueValue = option.getSpecificValueTrueVals(index) & 0xFF;\n        if (raw == falseValue) return false;\n        if (raw == trueValue) return true;\n        throw new IOException("Unexpected boolean byte 0x" + String.format("%02X", raw)\n                + " for " + option.getOptionName() + " at archive offset " + address\n                + " (expected 0x" + String.format("%02X", falseValue)\n                + " or 0x" + String.format("%02X", trueValue) + ").");\n    }'''
          s=repl(s,old,new,'strict boolean read')
          write(p,s)

          # 4) ARCH parser: never guess that a sole linked archive is self; validate local resource begin.
          p='src/main/java/ArchiveResourceIndex.java'; s=read(p)
          s=s.replace('''            if (selfIndex < 0 && linkedCount == 1) selfIndex = 0;\n''','')
          old='''                    boolean rangeValid = archiveOffset >= 0 && length > 0 && archiveOffset <= fileSize\n                            && length <= fileSize - archiveOffset;\n                    if (archiveIndex == selfIndex && rangeValid)\n                        out.regions.add(new Region(archiveOffset, archiveOffset + length, name, ci, resourceBegin));'''
          new='''                    boolean rangeValid = archiveOffset >= 0 && length > 0 && resourceBegin >= 0\n                            && archiveOffset <= fileSize && length <= fileSize - archiveOffset;\n                    if (archiveIndex == selfIndex && rangeValid)\n                        out.regions.add(new Region(archiveOffset, archiveOffset + length, name, ci, resourceBegin));'''
          s=repl(s,old,new,'ARCH range validation')
          write(p,s)

          # 5) Normal editor UI: remove redundant archive text and expose mixed grouped values.
          p='src/main/java/BaseEditPanel.java'; s=read(p)
          s=s.replace('sectionName + " — Game.layer.1.all.archive"','sectionName')
          old='''            invalidValues.clear();\n            dirtyOptions.clear();\n            for (JComponent c : entryValues) c.setEnabled(true);\n            for (JLabel label : entryLabels) label.setForeground(UiTheme.TEXT);\n            defaults.setEnabled(true);\n            current.setEnabled(true);\n            showPreset(0, false);\n            description.setText(sectionDescription + "\\nLoaded base archive."\n                    + (BackupManager.hasBackup(file) ? " | .bak available" : ""));'''
          new='''            invalidValues.clear();\n            dirtyOptions.clear();\n            ArrayList<String> mixed = new ArrayList<>();\n            for (int i = 0; i < entryValues.size(); i++) {\n                entryValues.get(i).setEnabled(true);\n                Option option = options.get(i);\n                boolean isMixed = option.hasMixedCurrentValues();\n                entryLabels.get(i).setText(option.getOptionName() + (isMixed ? " [mixed]" : ""));\n                entryLabels.get(i).setForeground(isMixed ? UiTheme.SUSPECTED : UiTheme.TEXT);\n                if (isMixed) mixed.add(option.getOptionName());\n            }\n            defaults.setEnabled(true);\n            current.setEnabled(true);\n            showPreset(0, false);\n            String mixedText = mixed.isEmpty() ? "" : "\\nMixed values: " + String.join(", ", mixed)\n                    + ". Editing synchronizes their mapped addresses.";\n            description.setText(sectionDescription + mixedText\n                    + (BackupManager.hasBackup(file) ? "\\nBackup available." : ""));'''
          s=repl(s,old,new,'Base loaded state')
          old='''        for (JComponent c : entryValues) c.setEnabled(false);\n        for (JLabel label : entryLabels) label.setForeground(UiTheme.MUTED);'''
          new='''        for (JComponent c : entryValues) c.setEnabled(false);\n        for (int i = 0; i < entryLabels.size(); i++) {\n            entryLabels.get(i).setText(options.get(i).getOptionName());\n            entryLabels.get(i).setForeground(UiTheme.MUTED);\n        }'''
          s=repl(s,old,new,'Base clear state')
          s=s.replace('"No " + sectionName + " changes to apply."','"No changes to apply."')
          write(p,s)

          # 6) Research Inspector: concise UI, async archive switching, U64, no fabricated candidate bytes.
          p='src/main/java/ResearchInspectorPanel.java'; s=read(p)
          if 'import java.math.BigInteger;' not in s: s=s.replace('import java.io.*;\n','import java.io.*;\nimport java.math.BigInteger;\n')
          if 'private boolean rebuildingSources;' not in s:
              s=s.replace('    private String[] contexts = new String[0];','    private String[] contexts = new String[0];\n    private boolean rebuildingSources;')
          for a,b in {
              'Research view: changed-byte runs are evidence, not assumed field boundaries.':'Changed-byte runs are evidence, not field boundaries.',
              'Logical Resource / HeaderLib Structure':'Resource Structure',
              'Candidate Boundary / Interpretation':'Candidate',
              'Multiple Interpretations':'Interpretations',
              'Comparison Evidence':'Comparisons',
              'Start delta:':'Delta:',
              'Interpret as:':'Type:',
              'Apply Selected Region':'Apply Candidate'
          }.items(): s=s.replace(a,b)
          s=s.replace('"Tactical — DLCPackTactical.layer.0.all.archive", "", null, false','"Tactical", "", null, false')
          old='''        sourceBox.addActionListener(e -> {\n            if (sourceBox.getSelectedItem() != null) loadSource((Source) sourceBox.getSelectedItem());\n        });\n        reload.addActionListener(e -> { if (activeSource != null) loadSource(activeSource); });'''
          new='''        sourceBox.addActionListener(e -> {\n            if (!rebuildingSources && sourceBox.getSelectedItem() != null)\n                loadSourceAsync((Source) sourceBox.getSelectedItem());\n        });\n        reload.addActionListener(e -> { if (activeSource != null) loadSourceAsync(activeSource); });'''
          s=repl(s,old,new,'Research handlers')
          pattern=r'    private void rebuildSources\(\) \{.*?\n    \}\n\n    private void loadSource\(Source s\) \{'
          replacement='''    private void rebuildSources() {\n        Source old = (Source) sourceBox.getSelectedItem();\n        String oldProfile = old == null ? null : old.profileName;\n        rebuildingSources = true;\n        try {\n            DefaultComboBoxModel<Source> m = new DefaultComboBoxModel<>();\n            m.addElement(new Source("Base", "Game.layer.1.all.archive", baseArchive, true));\n            for (String n : DLCProfiles.names()) m.addElement(new Source(shortDlc(n), n, dlcArchives.get(n), false));\n            sourceBox.setModel(m);\n            int selected = 0;\n            if (oldProfile != null) for (int i = 0; i < m.getSize(); i++)\n                if (m.getElementAt(i).profileName.equals(oldProfile)) { selected = i; break; }\n            sourceBox.setSelectedIndex(selected);\n        } finally { rebuildingSources = false; }\n        Source selected = (Source) sourceBox.getSelectedItem();\n        if (selected != null) loadSource(selected);\n    }\n\n    private void loadSourceAsync(Source s) {\n        if (s == null) return;\n        if (s.file == null || !s.file.isFile()) { loadSource(s); return; }\n        Window owner = SwingUtilities.getWindowAncestor(this);\n        JDialog dialog = new JDialog(owner, "Loading " + s.title, Dialog.ModalityType.APPLICATION_MODAL);\n        dialog.setDefaultCloseOperation(WindowConstants.DO_NOTHING_ON_CLOSE);\n        JPanel panel = new JPanel(new BorderLayout(8,8));\n        panel.setBorder(BorderFactory.createEmptyBorder(14,16,14,16));\n        JLabel message = new JLabel("Preparing archive...");\n        JProgressBar bar = new JProgressBar();\n        bar.setIndeterminate(true); bar.setStringPainted(true); bar.setString("Working");\n        bar.setPreferredSize(new Dimension(360,22));\n        final int[] dots={0};\n        javax.swing.Timer animation=new javax.swing.Timer(260,e->{dots[0]=(dots[0]+1)%4;bar.setString("Working"+".".repeat(dots[0]));});\n        animation.start();\n        panel.add(message,BorderLayout.NORTH); panel.add(bar,BorderLayout.CENTER);\n        dialog.setContentPane(panel); dialog.pack(); dialog.setResizable(false); dialog.setLocationRelativeTo(this); UiTheme.apply(dialog);\n        SwingWorker<Void,String> worker=new SwingWorker<>() {\n            @Override protected Void doInBackground() throws Exception {\n                publish("Indexing resources..."); ArchiveResourceIndex.load(s.file);\n                publish("Scanning identifiers...");\n                if (s.base) ArchiveContextResolver.resolve(s.file,BaseResearchProfiles.get().fields);\n                else DLCArchiveContextResolver.resolve(s.file,DLCProfiles.get(s.profileName).fields);\n                publish("Mapping structure..."); LogicalResourceCatalog.prewarm();\n                return null;\n            }\n            @Override protected void process(java.util.List<String> chunks){if(!chunks.isEmpty())message.setText(chunks.get(chunks.size()-1));}\n            @Override protected void done(){\n                animation.stop();\n                try { get(); bar.setIndeterminate(false); bar.setValue(100); bar.setString("Ready"); loadSource(s); }\n                catch(Exception ex){Throwable c=ex.getCause()==null?ex:ex.getCause();JOptionPane.showMessageDialog(ResearchInspectorPanel.this,c.getMessage()==null?c.toString():c.getMessage(),"Archive load error",JOptionPane.ERROR_MESSAGE);}\n                finally { dialog.dispose(); }\n            }\n        };\n        worker.execute(); dialog.setVisible(true);\n    }\n\n    private void loadSource(Source s) {'''
          s,n=re.subn(pattern,lambda m:replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Research rebuild replacement failed')
          # concise status
          old='''            status.setText((s.file != null && s.file.isFile() ? "Loaded " + s.file.getAbsolutePath()\n                    : "Profile loaded; archive file not detected")\n                    + " | " + rows.size() + " research rows"\n                    + (index == null ? "" : " | " + index.regionCount() + " mapped resource chunks")\n                    + " | " + structured + "/" + rows.size() + " rows with HeaderLib logical-resource metadata");'''
          new='''            status.setText(s.title + " | " + rows.size() + " rows | Structure " + structured + "/" + rows.size()\n                    + (s.file != null && s.file.isFile() ? " | " + s.file.getAbsolutePath() : " | archive not detected"));'''
          s=repl(s,old,new,'Research status')
          s=s.replace('confidenceLabel.setText(a.confidence + " — " + a.name);','confidenceLabel.setText(a.confidence.toString().replace(\'_\', \' \') + " — " + FieldConfidenceAudit.compactDisplayName(a, row.label));')
          s=s.replace('''evidence += "\\n\\nSTRUCTURE: This byte range is inside " + lr.logicalPath()\n                    + " at payload +0x" + Long.toHexString(po).toUpperCase(Locale.ROOT)\n                    + ". This is structural HeaderLib evidence only; it does not by itself prove the field's gameplay meaning.";''',
                      '''evidence += "\\n\\nStructure: " + lr.logicalPath() + " @ payload +0x"\n                    + Long.toHexString(po).toUpperCase(Locale.ROOT)\n                    + ". Location alone does not prove gameplay meaning.";''')
          s=s.replace('''            s.append("\\nBOUNDARY NOTE: this interpretation extends beyond the original changed-byte run (row width ")\n                    .append(row.length).append(").");''',
                      '''            s.append("\\nBoundary differs from diff run (row width ").append(row.length).append(").");''')
          s=s.replace('''    private byte[] sliceOriginal(Row r, int delta, int width) {\n        if (delta < 0 || delta + width > r.original.length) return new byte[width];\n        return Arrays.copyOfRange(r.original, delta, delta + width);\n    }''',
                      '''    private byte[] sliceOriginal(Row r, int delta, int width) {\n        if (delta < 0 || delta + width > r.original.length)\n            throw new IllegalArgumentException("Load the archive to inspect bytes outside the diff fragment.");\n        return Arrays.copyOfRange(r.original, delta, delta + width);\n    }''')
          old='''        long v = Long.parseLong(text);\n        long min = type.startsWith("Signed") && width < 8 ? -(1L << (width * 8 - 1)) : 0;\n        long max = type.startsWith("Signed") && width < 8 ? (1L << (width * 8 - 1)) - 1\n                : (width == 8 ? Long.MAX_VALUE : (1L << (width * 8)) - 1);\n        if (v < min || v > max) throw new IllegalArgumentException("Value does not fit selected width.");\n        byte[] b = new byte[width];\n        for (int i = 0; i < width; i++) b[i] = (byte) (v >>> (8 * i));\n        return b;'''
          new='''        boolean signed = type.startsWith("Signed");\n        int bits = width * 8;\n        BigInteger value = new BigInteger(text);\n        BigInteger modulus = BigInteger.ONE.shiftLeft(bits);\n        BigInteger min = signed ? BigInteger.ONE.shiftLeft(bits - 1).negate() : BigInteger.ZERO;\n        BigInteger max = signed ? BigInteger.ONE.shiftLeft(bits - 1).subtract(BigInteger.ONE) : modulus.subtract(BigInteger.ONE);\n        if (value.compareTo(min) < 0 || value.compareTo(max) > 0) throw new IllegalArgumentException("Value does not fit selected width.");\n        if (value.signum() < 0) value = value.add(modulus);\n        byte[] b = new byte[width];\n        for (int i = 0; i < width; i++) b[i] = value.shiftRight(8 * i).byteValue();\n        return b;'''
          s=repl(s,old,new,'U64 parser')
          write(p,s)

          # 7) Attribute column already has separate Status: remove duplicate confidence words and shorten curated names.
          p='src/main/java/FieldConfidenceAudit.java'; s=read(p)
          pattern=r'    static String compactDisplayName\(Assessment a, String generatedLabel\) \{.*?\n    private static String compactFamilyStat\(String family, String label\) \{.*?\n    \}\n\n'
          replacement='''    static String compactDisplayName(Assessment a, String generatedLabel) {\n        if (a == null) return "Unidentified";\n        String name = a.name == null ? "" : a.name.trim();\n        String family = weaponFamily(generatedLabel);\n        String lower = name.toLowerCase(Locale.ROOT);\n        if (family != null && (lower.contains("weapon stat") || lower.contains("upgrade parts cost"))) {\n            String stat = compactFamilyStat(family, generatedLabel);\n            return (lower.contains("upgrade parts cost") ? "Upgrade Cost - " : "Weapon Stat - ") + stat;\n        }\n        name = name.replace('—','-');\n        name = name.replaceFirst("(?i)^(strong\\s+suspected|suspected|confirmed):\\s*", "");\n        name = name.replace("Weapon Weapon Stat", "Weapon Stat");\n        name = name.replace("Energy Auto-Regeneration", "Energy Auto-Regen");\n        name = name.replace("Inventory Grid Width", "Inventory Width");\n        name = name.replace("Inventory Grid Control", "Inventory Grid");\n        name = name.replace("Magazine Capacity", "Magazine");\n        name = name.replace("Takedown Power Consumption Control", "Takedown Power Consumption");\n        name = name.replace("Standard-Reticle Function Slot / Silencer Override", "Reticle / Silencer Function");\n        name = name.replace("Built-in Silencer Enable Toggle", "Silencer Toggle");\n        name = name.replace("Bolt-Action Override Toggle", "Bolt-Action Toggle");\n        name = name.replace("Experimental Augmentation Gate", "Experimental Aug Gate");\n        name = name.replace("Health Regeneration Disable Component", "Health Regen - Disable");\n        name = name.replace("Damage Reduction L1 Default-Enable Component", "Damage Reduction L1 - Default");\n        name = name.replace("Suppressor Damage-Debuff Component", "Suppressor Debuff");\n        name = name.replace("Suppressor Companion Field", "Suppressor Companion");\n        name = name.replace("Damage-Penalty Control", "Damage Penalty");\n        name = name.replace("Micro-Assembler Experimental/Overclock Gate", "Micro-Assembler Exp/Overclock");\n        name = name.replace("Unresolved Tactical Field (contaminated Micro-Assembler archive)", "Unresolved Tactical Field");\n        name = name.replace("Augmentation Attribute", "Augmentation");\n        name = name.replaceAll("(?i)\\s+component\\s+\\d+\\b", "");\n        name = name.replaceAll("(?i)\\s+series\\s+\\d+\\b", "");\n        name = name.replaceAll("\\s+-\\s+", " - ");\n        return name.replaceAll("\\s{2,}", " ").trim();\n    }\n\n    private static String compactFamilyStat(String family, String label) {\n        String u = cleanGeneratedLabel(label).toUpperCase(Locale.ROOT).replace(' ', '_');\n        if (family.equals("Accuracy") && u.contains("ACCURACY_02")) return "Spread";\n        if (family.equals("Silencer")) return "Suppressor";\n        return family;\n    }\n\n'''
          s,n=re.subn(pattern,lambda m:replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('compact display replacement failed')
          write(p,s)

          # 8) Launcher text and duplicate source rebuilding.
          p='src/main/java/Launcher.java'; s=read(p)
          s=s.replace('DXMD Archive Editor Pro v0.7.10','DXMD Archive Editor Pro v0.7.11')
          s=s.replace('Restore Confirmed Fields to Original','Restore Confirmed Fields')
          s=s.replace('Select DXMD.exe to auto-detect the base game and installed DLC archives.','Select DXMD.exe to detect Base + DLC archives.')
          s=s.replace('"Confirmed base-game weapon and ammunition controls."','"Weapon and ammunition controls."')
          s=s.replace('"Confirmed player-energy and augmentation controls."','"Energy and augmentation controls."')
          s=s.replace('"Confirmed inventory dimensions and non-ammunition stack controls. Dimension edits can be unsafe when affected items already exist in a save."','"Inventory dimensions and stack sizes. Dimension edits can affect existing saves."')
          s=s.replace('"Confirmed store-price and crafting-cost controls."','"Shop prices and crafting costs."')
          s=s.replace('''private static void loadBaseArchiveEverywhere(File archive){loadedBaseArchive=archive;for(BaseEditPanel p:baseEditPanels)p.loadArchive(archive);if(researchInspector!=null)researchInspector.setBaseArchive(archive);}''',
                      '''private static void loadBaseArchiveEverywhere(File archive){loadedBaseArchive=archive;for(BaseEditPanel p:baseEditPanels)p.loadArchive(archive);}''')
          s=s.replace('''private static void clearBaseArchiveEverywhere(String message){loadedBaseArchive=null;for(BaseEditPanel p:baseEditPanels)p.clearArchive(message);if(researchInspector!=null)researchInspector.setBaseArchive(null);}''',
                      '''private static void clearBaseArchiveEverywhere(String message){loadedBaseArchive=null;for(BaseEditPanel p:baseEditPanels)p.clearArchive(message);}''')
          write(p,s)

          # 9) Catalog descriptions and stale wording.
          p='src/main/java/BaseOptionCatalog.java'; s=read(p)
          s=s.replace('Research-only and suspected values stay in Base Fields.','Research-only and suspected values stay in Research Inspector.')
          s=s.replace('return "Sets the " + what + " in inventory tiles. Clean game value is " + defaultValue + ". Range:0-16 " + dimensionWarning();',
                      'return what + " in inventory tiles. Default: " + defaultValue + ". Range: 0–16. " + dimensionWarning();')
          s=s.replace('return "WARNING: changing an item dimension while that item exists in a save can make the save unusable or crash the inventory. Drop affected items and save before changing dimensions.";',
                      'return "Save-risk; a full warning is shown before apply.";')
          write(p,s)

          p='src/main/java/GameLocator.java'; s=read(p).replace('import java.net.URISyntaxException;\n',''); write(p,s)

          # 10) Harden bundled DLC/profile parsing.
          p='src/main/java/DLCProfiles.java'; s=read(p)
          s=s.replace('''    static void load() throws Exception {\n        try(BufferedReader br=CompressedResource.open''','''    static void load() throws Exception {\n        profiles.clear();\n        try(BufferedReader br=CompressedResource.open''')
          s=s.replace('''                if(x[0].equals("PROFILE")){p=new Profile(x[1],Long.parseLong(x[2]));profiles.put(p.name,p);}\n                else if(x[0].equals("FIELD")){p.fields.add(new Field(Long.parseLong(x[1]),x[4],fromHex(x[2]),fromHex(x[3])));}''',
                      '''                if(x[0].equals("PROFILE")){if(x.length<3)throw new IOException("Malformed DLC PROFILE row");p=new Profile(x[1],Long.parseLong(x[2]));if(p.size<=0||profiles.put(p.name,p)!=null)throw new IOException("Invalid or duplicate DLC profile: "+p.name);}\n                else if(x[0].equals("FIELD")){if(p==null||x.length<5)throw new IOException("FIELD before PROFILE or malformed DLC row");p.fields.add(new Field(Long.parseLong(x[1]),x[4],fromHex(x[2]),fromHex(x[3])));}''')
          s=s.replace('''    static byte[] fromHex(String s){byte[] b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}''',
                      '''    static byte[] fromHex(String s){if(s==null||(s.length()&1)!=0)throw new IllegalArgumentException("Hex length must be even");byte[] b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}''')
          write(p,s)

          p='src/main/java/DLCReferenceProfiles.java'; s=read(p)
          s=s.replace('''    private static byte[] fromHex(String s){byte[] b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}''',
                      '''    private static byte[] fromHex(String s){if(s==null||(s.length()&1)!=0)throw new IllegalArgumentException("Hex length must be even");byte[] b=new byte[s.length()/2];for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);return b;}''')
          write(p,s)

          p='src/main/java/BaseResearchProfiles.java'; s=read(p)
          s=s.replace('Base Fields row','Base research row').replace('Base Fields profile','Base research profile').replace('Base Fields record','Base research record')
          write(p,s)

          # 11) Compressed resource argument validation.
          p='src/main/java/CompressedResource.java'; s=read(p)
          old='''    static BufferedReader openParts(Class<?> owner, String... resources) throws IOException {\n        ByteArrayOutputStream encoded = new ByteArrayOutputStream();'''
          new='''    static BufferedReader openParts(Class<?> owner, String... resources) throws IOException {\n        if (owner == null) throw new IllegalArgumentException("Resource owner is required.");\n        if (resources == null || resources.length == 0) throw new IllegalArgumentException("At least one resource is required.");\n        ByteArrayOutputStream encoded = new ByteArrayOutputStream();'''
          s=repl(s,old,new,'CompressedResource args')
          write(p,s)

          # 12) Build/version/docs.
          for name in ('build.sh','build.bat'):
              p=Path(name); s=p.read_text().replace('DXMD-Archive-Editor-Pro-v0.7.10.jar','DXMD-Archive-Editor-Pro-v0.7.11.jar'); p.write_text(s)

          p=Path('README.md'); s=p.read_text()
          s=s.replace('> **Current version:** v0.7.10','> **Current version:** v0.7.11')
          s=s.replace('dist/DXMD-Archive-Editor-Pro-v0.7.10.jar','dist/DXMD-Archive-Editor-Pro-v0.7.11.jar')
          s=s.replace('## Base Fields\n','## Legacy Base Fields notes (pre-v0.7.1)\n')
          s=s.replace('## DLC Fields\n','## Legacy DLC Fields notes (pre-v0.7.1)\n')
          anchor='## v0.7.10 concise research attributes\n'
          section='''## v0.7.11 full code and text audit\n\nv0.7.11 audits the complete Java source tree and current Base/DLC research UI. It removes redundant visible wording, streams archive context scans, adds animated background loading for Research Inspector archive switches, fixes full U64 editing, rejects fabricated candidate bytes without a loaded archive, exposes mixed grouped values, preserves monospaced byte views, tightens ARCH/boolean/profile validation, and runs Java 21 lint/regressions. See **CODE_AUDIT_v0.7.11.md**.\n\n'''
          if section not in s: s=s.replace(anchor,section+anchor)
          p.write_text(s)

          Path('RELEASE_NOTES.md').write_text('''# DXMD Archive Editor Pro v0.7.11\n\n## Full code + redundant-text audit\n\n- Audited the complete Java source tree and all current Base/DLC research presentation paths.\n- Removed duplicated confidence wording from Attribute; Status remains the confidence column.\n- Shortened Research Inspector headings/status text and known-stat tab wording without removing evidence.\n- Streamed archive text scanning instead of loading entire archives into heap.\n- Added animated background loading when switching Research Inspector archives.\n- Added true unsigned 64-bit editing through 18446744073709551615.\n- Stopped candidate inspection from inventing zero bytes when an archive is not loaded.\n- Grouped normal controls now mark mixed underlying values.\n- Boolean controls reject unexpected raw encodings instead of silently coercing them.\n- ARCH indexing no longer guesses that a single linked archive is the current file.\n- Preserved monospaced raw-byte/interpretation views.\n- Hardened bundled DLC/profile and compressed-resource parsing.\n- Java 21 compile, lint and profile/UI regressions run before release.\n\nSee CODE_AUDIT_v0.7.11.md for findings and remaining design debt.\n''')

          Path('CODE_AUDIT_v0.7.11.md').write_text('''# DXMD Archive Editor Pro v0.7.11 Code Audit\n\n## Scope\nReviewed every Java source file currently in `src/main/java`, all option classes, Base/DLC research profile loaders, archive/context/index code, editing/backup/restore paths, Swing loading/theme code, and visible current UI strings.\n\n## Fixed in v0.7.11\n- Whole-archive context scans: Base/DLC context resolution now uses the streaming scanner.\n- EDT stalls on Research Inspector source changes: first-time archive preparation runs in SwingWorker with an animated modal progress bar.\n- U64 edit truncation: unsigned 8-byte values use BigInteger and allow the full 0..2^64-1 range.\n- Fake candidate bytes: out-of-fragment inspection requires a loaded archive instead of returning zero-filled bytes.\n- Grouped option ambiguity: differing mapped values are marked `[mixed]`.\n- Boolean corruption/mod incompatibility: raw values must match an exact configured false or true encoding.\n- ARCH self-link guess: removed the unsafe single-link fallback; local chunk ranges also require non-negative resource begins.\n- Theme font regression: explicit monospaced views stay monospaced.\n- DLC/profile parsers: added repeat-load clearing, row/order checks, duplicate-profile rejection and even-length hex validation.\n- UI redundancy: shortened current headings/status text, source names, tab descriptions and Attribute labels while preserving full evidence.\n- Stale terminology: current code/docs refer to Research Inspector rather than the removed Base/DLC Fields UI.\n\n## Verified / retained\n- Research profiles remain sorted and non-overlapping: Base 2,546 rows, DLC 350 rows.\n- Logical resource catalog remains 10 verified payload ranges covering all 2,896 current research rows when archives are loaded.\n- Selective restore still writes confirmed mappings only; research/suspected fields are excluded.\n- `.bak` creation remains non-destructive: an existing backup is preserved.\n- ArchiveResourceIndex caches by canonical path, size and modified timestamp.\n\n## Remaining design debt\n- Normal-editor writes are not transactionally journaled. A backup exists before writes, but a low-level I/O failure could leave a partially modified archive; automatic rollback is intentionally avoided because an old `.bak` may predate other user mods.\n- Existing `.bak` files are preserved indefinitely and can become stale after game updates. A future backup-history/version UI would be safer than silently replacing them.\n- Compressed profile resources are still Base64-decoded into memory before GZIP streaming. They are small compared with game archives, so this is low priority.\n- LogicalResourceCatalog is a verified static catalog rather than a runtime HeaderLib parser. This keeps startup fast but requires a release to add newly decoded libraries.\n- Context resolvers intentionally use heuristic nearby identifiers; they remain evidence only and never promote confidence by proximity.\n''')

      - name: Build Java 21
        run: bash build.sh

      - name: Java 21 lint audit
        shell: bash
        run: |
          rm -rf build/lint && mkdir -p build/lint
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 21 -encoding UTF-8 -Xlint:all -d build/lint

      - name: Run audit regressions
        shell: bash
        run: |
          cat > build/V0711Audit.java <<'JAVA'
          import java.io.*;
          import java.lang.reflect.*;
          import java.math.BigInteger;
          import java.nio.file.*;
          import javax.swing.*;
          import options.*;
          public class V0711Audit {
            static void check(boolean v,String m){if(!v)throw new RuntimeException(m);}
            public static void main(String[] args) throws Exception {
              check(BaseResearchProfiles.get().fields.size()==2546,"Base row count");
              int dlc=0; for(String n:DLCProfiles.names()) dlc+=DLCProfiles.get(n).fields.size();
              check(dlc==350,"DLC row count");
              check(LogicalResourceCatalog.mappingCount()==10,"HeaderLib mapping count");
              ResearchInspectorPanel panel=new ResearchInspectorPanel();
              Field tf=ResearchInspectorPanel.class.getDeclaredField("table"); tf.setAccessible(true);
              JTable t=(JTable)tf.get(panel); check(t.getColumnCount()==3,"Research columns");
              check("Status".equals(t.getColumnName(0))&&"Attribute".equals(t.getColumnName(1))&&"User ID".equals(t.getColumnName(2)),"Research column names");
              var a=new FieldConfidenceAudit.Assessment(FieldConfidenceAudit.Confidence.SUSPECTED,"Suspected: Weapon Weapon Stat — Accuracy 02 component 3","",false);
              check("Weapon Stat - Spread".equals(FieldConfidenceAudit.compactDisplayName(a,"ACCURACY_02 component 3")),"compact label");
              // Full U64 path via private parseEditBytes.
              Method parse=ResearchInspectorPanel.class.getDeclaredMethod("parseEditBytes",String.class,String.class,int.class); parse.setAccessible(true);
              byte[] max=(byte[])parse.invoke(panel,"Unsigned integer (LE)","18446744073709551615",8);
              check(max.length==8,"U64 width"); for(byte b:max) check((b&255)==255,"U64 max bytes");
              // Strict boolean decode rejects an unknown raw byte.
              Path tmp=Files.createTempFile("dxmd-bool-audit",".bin"); Files.write(tmp,new byte[]{2});
              BooleanOption bo=new BooleanOption(new java.util.ArrayList<>(java.util.List.of(0L)),new java.util.ArrayList<>(java.util.List.of((short)0)),new java.util.ArrayList<>(java.util.List.of((short)1)),"Audit Bool","",false);
              boolean rejected=false; try{FileAnalyzer.analyze(tmp.toFile(),new java.util.ArrayList<>(java.util.List.of(bo)));}catch(IOException ex){rejected=true;} finally{Files.deleteIfExists(tmp);} check(rejected,"strict boolean decode");
              System.out.println("v0.7.11 audit regressions OK: Base 2546, DLC 350, U64, strict boolean, UI");
            }
          }
          JAVA
          javac --release 21 -cp build/classes -d build/classes build/V0711Audit.java
          java -Djava.awt.headless=true -cp build/classes V0711Audit
          javap -verbose -classpath build/classes Launcher | grep -q 'major version: 65'
          jar tf dist/DXMD-Archive-Editor-Pro-v0.7.11.jar | grep -q '^ResearchInspectorPanel.class$'

      - name: Package ZIP and checksums
        shell: bash
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.7.11.jar'
          HASH="$(sha256sum "$JAR" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'DXMD-Archive-Editor-Pro-v0.7.11.jar' > dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256
          rm -rf build/release-package && mkdir -p build/release-package
          cp "$JAR" dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256 CODE_AUDIT_v0.7.11.md build/release-package/
          cat > build/release-package/VERIFY.txt <<'TXT'
          DXMD Archive Editor Pro v0.7.11
          Java 21 or newer required.

          Windows verification:
            certutil -hashfile DXMD-Archive-Editor-Pro-v0.7.11.jar SHA256
          Compare with DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256.
          TXT
          (cd build/release-package && zip -9 ../../dist/DXMD-Archive-Editor-Pro-v0.7.11.zip DXMD-Archive-Editor-Pro-v0.7.11.jar DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256 VERIFY.txt CODE_AUDIT_v0.7.11.md)
          sha256sum dist/DXMD-Archive-Editor-Pro-v0.7.11.jar
          sha256sum dist/DXMD-Archive-Editor-Pro-v0.7.11.zip

      - name: Commit audited source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java build.sh build.bat README.md RELEASE_NOTES.md CODE_AUDIT_v0.7.11.md
          git commit -m "Complete v0.7.11 code and UI text audit"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXMD-Archive-Editor-Pro-v0.7.11
          path: |
            dist/DXMD-Archive-Editor-Pro-v0.7.11.zip
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256
            CODE_AUDIT_v0.7.11.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.11
          name: DXMD Archive Editor Pro v0.7.11
          body_path: RELEASE_NOTES.md
          files: |
            dist/DXMD-Archive-Editor-Pro-v0.7.11.zip
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar
            dist/DXMD-Archive-Editor-Pro-v0.7.11.jar.sha256
            CODE_AUDIT_v0.7.11.md
