name: Apply v0.6.14 confidence audit

on:
  push:
    paths:
      - '.github/workflows/apply-v0.6.14-confidence-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply confidence audit
        run: python3 tools/apply_v0614_confidence_audit.py

      - name: Compile audited source
        run: bash build.sh

      - name: Smoke-check confidence classes
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.14.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^FieldConfidenceAudit.class$'
          jar tf "$JAR" | grep -q '^DLCEditorPanel.class$'
          jar tf "$JAR" | grep -q '^BaseFieldsPanel.class$'
          jar tf "$JAR" | grep -q '^DLCArchiveContextResolver.class$'

      - name: Commit audited source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java README.md RELEASE_NOTES.md build.sh build.bat
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Audit Base and DLC field confidence for v0.6.14'
            git push origin HEAD:main
          fi
