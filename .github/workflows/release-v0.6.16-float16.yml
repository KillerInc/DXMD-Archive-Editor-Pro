name: Release v0.6.16 editable Float16

on:
  push:
    paths:
      - '.github/workflows/release-v0.6.16-float16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Add editable Float16 research column
        shell: bash
        run: |
          cat > src/main/java/HalfFloat.java <<'EOF'
          /** IEEE-754 binary16 helpers for the archive research tables. */
          final class HalfFloat {
              private HalfFloat() {}

              static String formatLE(byte[] bytes) {
                  if (bytes == null || bytes.length != 2) return "";
                  int bits = (bytes[0] & 0xFF) | ((bytes[1] & 0xFF) << 8);
                  return Float.toString(toFloat(bits));
              }

              static byte[] parseLE(String text) {
                  if (text == null || text.trim().isEmpty()) throw new IllegalArgumentException("Enter a Float16 value.");
                  float value;
                  try { value = Float.parseFloat(text.trim()); }
                  catch (NumberFormatException ex) { throw new IllegalArgumentException("Invalid Float16 value: " + text); }
                  if (Float.isFinite(value) && Math.abs(value) > 65504.0f)
                      throw new IllegalArgumentException("Finite Float16 range is -65504 to 65504.");
                  int bits = fromFloat(value);
                  return new byte[]{(byte) bits, (byte) (bits >>> 8)};
              }

              static float toFloat(int half) {
                  int sign = (half >>> 15) & 1;
                  int exp = (half >>> 10) & 0x1F;
                  int mant = half & 0x3FF;
                  float value;
                  if (exp == 0) {
                      value = mant == 0 ? 0.0f : Math.scalb((float) mant, -24);
                  } else if (exp == 31) {
                      value = mant == 0 ? Float.POSITIVE_INFINITY : Float.NaN;
                  } else {
                      value = Math.scalb(1.0f + mant / 1024.0f, exp - 15);
                  }
                  return sign == 0 ? value : -value;
              }

              static int fromFloat(float value) {
                  int bits = Float.floatToRawIntBits(value);
                  int sign = (bits >>> 16) & 0x8000;
                  int exp = (bits >>> 23) & 0xFF;
                  int mant = bits & 0x7FFFFF;

                  if (exp == 0xFF) {
                      if (mant == 0) return sign | 0x7C00;
                      return sign | 0x7E00; // canonical quiet NaN
                  }

                  int halfExp = exp - 127 + 15;
                  if (halfExp >= 31) return sign | 0x7C00;
                  if (halfExp <= 0) {
                      if (halfExp < -10) return sign;
                      mant |= 0x800000;
                      int shift = 14 - halfExp;
                      int halfMant = mant >>> shift;
                      int remainder = mant & ((1 << shift) - 1);
                      int halfway = 1 << (shift - 1);
                      if (remainder > halfway || (remainder == halfway && (halfMant & 1) != 0)) halfMant++;
                      return sign | halfMant;
                  }

                  int halfMant = mant >>> 13;
                  int remainder = mant & 0x1FFF;
                  if (remainder > 0x1000 || (remainder == 0x1000 && (halfMant & 1) != 0)) {
                      halfMant++;
                      if (halfMant == 0x400) {
                          halfMant = 0;
                          halfExp++;
                          if (halfExp >= 31) return sign | 0x7C00;
                      }
                  }
                  return sign | (halfExp << 10) | (halfMant & 0x3FF);
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected source fragment not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # Base Fields renderer: Float16 is column 4, so hex columns shift right one.
          replace('src/main/java/BaseFieldsPanel.java',
          '''            boolean hexColumn=col>=4;
                      if(hexColumn&&f!=null){
                          byte[] shown;
                          if(col==4) shown=f.current;
                          else if(col==5) shown=f.original;
                          else shown=f.reference(selectedComparisons().get(col-6));''',
          '''            boolean hexColumn=col>=5;
                      if(hexColumn&&f!=null){
                          byte[] shown;
                          if(col==5) shown=f.current;
                          else if(col==6) shown=f.original;
                          else shown=f.reference(selectedComparisons().get(col-7));''')

          replace('src/main/java/BaseFieldsPanel.java',
          '''        public int getColumnCount(){return 6+selectedComparisons().size();}
                  public String getColumnName(int c){if(c==0)return "Attribute Name";if(c==1)return "Nearby context / field";if(c==2)return "User ID";if(c==3)return "Current decimal";if(c==4)return "Current hex";if(c==5)return "Original hex";return selectedComparisons().get(c-6)+" hex";}
                  public Object getValueAt(int r,int c){BaseResearchProfiles.Field f=profile.fields.get(r);if(c==0)return attributeName(r);if(c==1)return nearbyContext(r);if(c==2)return f.identifiedAs;if(c==3)return decimal(f.current);if(c==4)return hex(f.current);if(c==5)return hex(f.original);String n=selectedComparisons().get(c-6);return hex(f.reference(n));}
                  public boolean isCellEditable(int r,int c){return c==2||c==3;}
                  public void setValueAt(Object v,int r,int c){BaseResearchProfiles.Field f=profile.fields.get(r);try{if(c==2)f.identifiedAs=String.valueOf(v).trim();else if(c==3)f.current=parseDecimal(String.valueOf(v),f.original.length);else return;}catch(Exception ex){JOptionPane.showMessageDialog(BaseFieldsPanel.this,ex.getMessage(),"Invalid value",JOptionPane.ERROR_MESSAGE);}fireTableRowsUpdated(r,r);}''',
          '''        public int getColumnCount(){return 7+selectedComparisons().size();}
                  public String getColumnName(int c){if(c==0)return "Attribute Name";if(c==1)return "Nearby context / field";if(c==2)return "User ID";if(c==3)return "Current decimal";if(c==4)return "Float16 (LE)";if(c==5)return "Current hex";if(c==6)return "Original hex";return selectedComparisons().get(c-7)+" hex";}
                  public Object getValueAt(int r,int c){BaseResearchProfiles.Field f=profile.fields.get(r);if(c==0)return attributeName(r);if(c==1)return nearbyContext(r);if(c==2)return f.identifiedAs;if(c==3)return decimal(f.current);if(c==4)return HalfFloat.formatLE(f.current);if(c==5)return hex(f.current);if(c==6)return hex(f.original);String n=selectedComparisons().get(c-7);return hex(f.reference(n));}
                  public boolean isCellEditable(int r,int c){return c==2||c==3||(c==4&&profile.fields.get(r).original.length==2);}
                  public void setValueAt(Object v,int r,int c){BaseResearchProfiles.Field f=profile.fields.get(r);try{if(c==2)f.identifiedAs=String.valueOf(v).trim();else if(c==3)f.current=parseDecimal(String.valueOf(v),f.original.length);else if(c==4&&f.original.length==2)f.current=HalfFloat.parseLE(String.valueOf(v));else return;}catch(Exception ex){JOptionPane.showMessageDialog(BaseFieldsPanel.this,ex.getMessage(),"Invalid value",JOptionPane.ERROR_MESSAGE);}fireTableRowsUpdated(r,r);}''')

          # DLC renderer/table follows the same column layout.
          replace('src/main/java/DLCEditorPanel.java',
          '''                boolean hexColumn=col>=4;
                          if(hexColumn){
                              byte[] shown;if(col==4)shown=f.current;else if(col==5)shown=f.original;else shown=referenceBytes(f,selectedComparisons().get(col-6));''',
          '''                boolean hexColumn=col>=5;
                          if(hexColumn){
                              byte[] shown;if(col==5)shown=f.current;else if(col==6)shown=f.original;else shown=referenceBytes(f,selectedComparisons().get(col-7));''')

          replace('src/main/java/DLCEditorPanel.java',
          '''            public int getColumnCount(){return 6+selectedComparisons().size();}
                      public String getColumnName(int c){if(c==0)return "Attribute Name";if(c==1)return "Nearby context / field";if(c==2)return "User ID";if(c==3)return "Current decimal";if(c==4)return "Current hex";if(c==5)return "Original hex";return selectedComparisons().get(c-6)+" hex";}
                      public Object getValueAt(int r,int c){DLCProfiles.Field f=p.fields.get(r);if(c==0)return attributeFor(f);if(c==1)return nearbyContext(r);if(c==2)return f.identifiedAs;if(c==3)return decimal(f.current);if(c==4)return hex(f.current);if(c==5)return hex(f.original);return hex(referenceBytes(f,selectedComparisons().get(c-6)));}
                      public boolean isCellEditable(int r,int c){return c==2||c==3;}
                      public void setValueAt(Object v,int r,int c){DLCProfiles.Field f=p.fields.get(r);try{if(c==2)f.identifiedAs=String.valueOf(v).trim();else if(c==3)f.current=parseDecimal(String.valueOf(v),f.original.length);else return;}catch(Exception ex){JOptionPane.showMessageDialog(DLCEditorPanel.this,ex.getMessage(),"Invalid value",JOptionPane.ERROR_MESSAGE);}fireTableRowsUpdated(r,r);}''',
          '''            public int getColumnCount(){return 7+selectedComparisons().size();}
                      public String getColumnName(int c){if(c==0)return "Attribute Name";if(c==1)return "Nearby context / field";if(c==2)return "User ID";if(c==3)return "Current decimal";if(c==4)return "Float16 (LE)";if(c==5)return "Current hex";if(c==6)return "Original hex";return selectedComparisons().get(c-7)+" hex";}
                      public Object getValueAt(int r,int c){DLCProfiles.Field f=p.fields.get(r);if(c==0)return attributeFor(f);if(c==1)return nearbyContext(r);if(c==2)return f.identifiedAs;if(c==3)return decimal(f.current);if(c==4)return HalfFloat.formatLE(f.current);if(c==5)return hex(f.current);if(c==6)return hex(f.original);return hex(referenceBytes(f,selectedComparisons().get(c-7)));}
                      public boolean isCellEditable(int r,int c){return c==2||c==3||(c==4&&p.fields.get(r).original.length==2);}
                      public void setValueAt(Object v,int r,int c){DLCProfiles.Field f=p.fields.get(r);try{if(c==2)f.identifiedAs=String.valueOf(v).trim();else if(c==3)f.current=parseDecimal(String.valueOf(v),f.original.length);else if(c==4&&f.original.length==2)f.current=HalfFloat.parseLE(String.valueOf(v));else return;}catch(Exception ex){JOptionPane.showMessageDialog(DLCEditorPanel.this,ex.getMessage(),"Invalid value",JOptionPane.ERROR_MESSAGE);}fireTableRowsUpdated(r,r);}''')

          replace('src/main/java/Launcher.java','DXMD Archive Editor Pro v0.6.15','DXMD Archive Editor Pro v0.6.16')
          for name in ['build.sh','build.bat']:
              p=Path(name); p.write_text(p.read_text().replace('v0.6.15','v0.6.16'))

          p=Path('README.md'); s=p.read_text()
          s=s.replace('> **Current version:** v0.6.15','> **Current version:** v0.6.16',1)
          s=s.replace('dist/DXMD-Archive-Editor-Pro-v0.6.15.jar','dist/DXMD-Archive-Editor-Pro-v0.6.16.jar',1)
          marker='## DLC Fields\n'
          note='''## v0.6.16 editable Float16 research view\n\nBase Fields and DLC Fields now include an editable **Float16 (LE)** column immediately beside **Current decimal**. It is enabled only for exact 2-byte fields. The column interprets the two archive bytes as IEEE-754 binary16 in little-endian order; editing it writes the corresponding two-byte half-float representation and immediately updates the decimal/hex views. For example, `2.25` encodes to `80 40`. This is an alternate numeric interpretation for research, not a claim that every 2-byte field is a float.\n\n'''
          if note not in s:
              s=s.replace(marker,note+marker,1)
          p.write_text(s)

          Path('RELEASE_NOTES.md').write_text('''# DXMD Archive Editor Pro v0.6.16\n\n## Editable Float16 research values\n\nThis update adds a **Float16 (LE)** column beside **Current decimal** in both Base Fields and DLC Fields.\n\n- The column is editable only for exact 2-byte fields.\n- It interprets those bytes as little-endian IEEE-754 binary16 without changing the existing integer/hex views.\n- Editing Float16 updates the underlying two bytes, so Current Decimal, Float16 and Current Hex remain synchronized.\n- Example: `2.25` encodes to `80 40`; `-2.25` encodes to `80 C0`.\n- Finite values outside binary16's range (-65504 to 65504) are rejected instead of silently overflowing.\n- Infinity and NaN can still be represented explicitly if entered by name.\n- Blank Float16 cells on non-2-byte fields are intentional.\n\nThe Float16 view is a research aid. A plausible half-float value does not by itself prove that a field's game semantics are floating-point.\n\nAll v0.6.15 raw-archive audit corrections and conservative confidence rules remain intact.\n\n## Requirements\n\nJava 11 or newer. Keep backups before testing research-field edits.\n''')
          PY

      - name: Build
        run: bash build.sh

      - name: Test Float16 codec and audit startup
        shell: bash
        run: |
          cat > build/Float16Sanity.java <<'EOF'
          public class Float16Sanity {
              private static String hex(byte[] b){return String.format("%02X%02X",b[0]&255,b[1]&255);}
              private static void expect(String got,String want){if(!got.equals(want))throw new RuntimeException("Expected "+want+", got "+got);}
              public static void main(String[] args){
                  expect(HalfFloat.formatLE(new byte[]{(byte)0x80,0x40}),"2.25");
                  expect(HalfFloat.formatLE(new byte[]{(byte)0x80,(byte)0xC0}),"-2.25");
                  expect(hex(HalfFloat.parseLE("2.25")),"8040");
                  expect(hex(HalfFloat.parseLE("-2.25")),"80C0");
                  expect(hex(HalfFloat.parseLE("3.140625")),"4842");
                  boolean rejected=false; try{HalfFloat.parseLE("70000");}catch(IllegalArgumentException e){rejected=true;}
                  if(!rejected)throw new RuntimeException("Float16 overflow was not rejected");
                  if(BaseResearchProfiles.get().fields.isEmpty())throw new RuntimeException("Base audit profile failed to load");
                  for(String n:DLCProfiles.names())if(DLCProfiles.get(n).fields.isEmpty())throw new RuntimeException("DLC audit profile failed to load: "+n);
                  System.out.println("Float16 OK: 2.25=8040, -2.25=80C0, 3.140625=4842");
              }
          }
          EOF
          javac --release 11 -cp build/classes -d build/classes build/Float16Sanity.java
          java -cp build/classes Float16Sanity

      - name: Verify JAR
        shell: bash
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.16.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^Launcher.class$'
          jar tf "$JAR" | grep -q '^HalfFloat.class$'
          jar tf "$JAR" | grep -q '^BaseFieldsPanel.class$'
          jar tf "$JAR" | grep -q '^DLCEditorPanel.class$'

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/HalfFloat.java src/main/java/BaseFieldsPanel.java src/main/java/DLCEditorPanel.java src/main/java/Launcher.java build.sh build.bat README.md RELEASE_NOTES.md
          git commit -m 'Add editable Float16 research column'
          git push origin HEAD:main

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXMD-Archive-Editor-Pro-v0.6.16
          path: dist/DXMD-Archive-Editor-Pro-v0.6.16.jar
          if-no-files-found: error

      - name: Create v0.6.16 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.6.16'
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.16.jar'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'DXMD Archive Editor Pro v0.6.16' --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target main --title 'DXMD Archive Editor Pro v0.6.16' --notes-file RELEASE_NOTES.md
          fi
