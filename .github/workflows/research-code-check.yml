name: Research Code Check

on:
  push:
    paths:
      - 'src/main/java/VerifiedHexCatalog.java'
      - 'src/main/java/VerifiedParagraphCatalog.java'
      - 'src/main/java/FieldConfidenceAudit.java'
      - 'src/main/java/ResearchInspectorPanel.java'
      - '.github/workflows/research-code-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: bash build.sh
      - name: Lint
        shell: bash
        run: |
          rm -rf build/research-lint
          mkdir -p build/research-lint
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 21 -encoding UTF-8 -Xlint:all -d build/research-lint

      - name: Verify published-layout overlap detection
        shell: bash
        run: |
          cat > build/VerifiedLayoutAudit.java <<'JAVA'
          import java.nio.file.*;
          public class VerifiedLayoutAudit {
            public static void main(String[] args) throws Exception {
              byte[] b=new byte[96];
              byte[] marker={(byte)0x79,(byte)0xD8,(byte)0x98,(byte)0xE8};
              System.arraycopy(marker,0,b,20,4);
              b[36]=6;
              Path p=Files.createTempFile("dxmd-layout",".bin");
              Files.write(p,b);
              String hit=VerifiedHexCatalog.evidenceNear(p.toFile(),36,1,48);
              if(!hit.contains("OVERLAPS VERIFIED VALUE") || !hit.contains("base magazine capacity"))
                throw new RuntimeException(hit);
              String near=VerifiedHexCatalog.evidenceNear(p.toFile(),30,1,48);
              if(near.contains("OVERLAPS VERIFIED VALUE"))
                throw new RuntimeException("false overlap: "+near);
              Files.deleteIfExists(p);
              System.out.println("verified layout overlap audit OK");
            }
          }
          JAVA
          javac --release 21 -cp build/classes -d build/classes build/VerifiedLayoutAudit.java
          java -cp build/classes VerifiedLayoutAudit
