name: Release v0.6.15

on:
  push:
    paths:
      - '.github/workflows/release-v0.6.15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Finalize raw-audit source integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def req(text,old,new,label):
              if old not in text: raise SystemExit('Required patch target missing: '+label)
              return text.replace(old,new,1)

          path='src/main/java/RawArchiveAuditCatalog.java'
          s=read(path)
          s=s.replace('"Takedown Power Consumption Override"','"Takedown Power Consumption Control"')
          old='add(archive,offset,"4DC71C10",Level.CONFIRMED,weapon+" Built-in Silencer Function ID",\n                "Silence To The Guns replaces 4DC71C10 with 26ACCD27; its guide identifies that replacement as redirecting the weapon to the built-in silencer function.",false);'
          new='add(archive,offset,"4DC71C10",Level.CONFIRMED,weapon+" Standard-Reticle Function Slot / Silencer Override",\n                "Silence To The Guns documents 4DC71C10 as a sniper/standard-reticle-related function and replaces it with 26ACCD27, the built-in silencer function ID. The field is therefore a function slot used by the mod for a silencer override; 4DC71C10 itself is not a silencer ID.",false);'
          s=req(s,old,new,'Silence function-slot semantics')
          write(path,s)

          path='src/main/java/FieldConfidenceAudit.java'
          s=read(path)
          s=req(s,'    static boolean isBaseConfirmed(BaseResearchProfiles.Field f) {\n        if (f==null || f.category==null || !f.category.startsWith("KNOWN")) return false;',
                '    static boolean isBaseConfirmed(BaseResearchProfiles.Field f) {\n        if (f==null) return false;\n        RawArchiveAuditCatalog.Mapping raw=rawBaseMapping(f);\n        if (raw!=null) return raw.level==RawArchiveAuditCatalog.Level.CONFIRMED;\n        if (f.category==null || !f.category.startsWith("KNOWN")) return false;','Base confirmed raw override')
          s=req(s,'    static Assessment assessBase(BaseResearchProfiles.Field f, String nearbySpecific, String nearbyContext) {\n        if (f==null) return unidentified();',
                '    static Assessment assessBase(BaseResearchProfiles.Field f, String nearbySpecific, String nearbyContext) {\n        if (f==null) return unidentified();\n        RawArchiveAuditCatalog.Mapping raw=rawBaseMapping(f);\n        if (raw!=null) return rawAssessment(raw);','Base raw assessment')
          s=req(s,'    static boolean isBaseSaveRisk(BaseResearchProfiles.Field f) {\n        if (!isBaseConfirmed(f)) return false;',
                '    static boolean isBaseSaveRisk(BaseResearchProfiles.Field f) {\n        if (f==null) return false;\n        RawArchiveAuditCatalog.Mapping raw=rawBaseMapping(f);\n        if (raw!=null) return raw.saveRisk;\n        if (!isBaseConfirmed(f)) return false;','Base raw save risk')
          s=req(s,'    static boolean isDlcConfirmed(String profileName, DLCProfiles.Field f) {\n        if (f==null) return false;',
                '    static boolean isDlcConfirmed(String profileName, DLCProfiles.Field f) {\n        if (f==null) return false;\n        RawArchiveAuditCatalog.Mapping raw=rawDlcMapping(profileName,f);\n        if (raw!=null) return raw.level==RawArchiveAuditCatalog.Level.CONFIRMED;','DLC confirmed raw override')
          s=req(s,'    static boolean isDlcSaveRisk(String profileName, DLCProfiles.Field f) {\n        if (f==null) return false;',
                '    static boolean isDlcSaveRisk(String profileName, DLCProfiles.Field f) {\n        if (f==null) return false;\n        RawArchiveAuditCatalog.Mapping raw=rawDlcMapping(profileName,f);\n        if (raw!=null) return raw.saveRisk;','DLC raw save risk')
          s=req(s,'    static Assessment assessDlc(String profileName, DLCProfiles.Field f, String nearbyContext) {\n        if (f==null) return unidentified();',
                '    static Assessment assessDlc(String profileName, DLCProfiles.Field f, String nearbyContext) {\n        if (f==null) return unidentified();\n        RawArchiveAuditCatalog.Mapping raw=rawDlcMapping(profileName,f);\n        if (raw!=null) return rawAssessment(raw);','DLC raw assessment')
          marker='    private static Assessment unidentified() {\n        return new Assessment(Confidence.UNIDENTIFIED, "Unidentified", "No focused comparison or trustworthy structural evidence identifies this row yet.", false);\n    }'
          helpers='    private static RawArchiveAuditCatalog.Mapping rawBaseMapping(BaseResearchProfiles.Field f) {\n        if (f==null || f.original==null) return null;\n        return RawArchiveAuditCatalog.mapping("Game.layer.1.all.archive",f.offset,f.original.length);\n    }\n\n    private static RawArchiveAuditCatalog.Mapping rawDlcMapping(String profileName,DLCProfiles.Field f) {\n        if (f==null || f.original==null || profileName==null) return null;\n        return RawArchiveAuditCatalog.mapping(profileName,f.offset,f.original.length);\n    }\n\n    private static Assessment rawAssessment(RawArchiveAuditCatalog.Mapping raw) {\n        Confidence confidence;\n        if (raw.level==RawArchiveAuditCatalog.Level.CONFIRMED) confidence=Confidence.CONFIRMED;\n        else if (raw.level==RawArchiveAuditCatalog.Level.STRONG_SUSPECTED) confidence=Confidence.STRONG_SUSPECTED;\n        else confidence=Confidence.SUSPECTED;\n        String evidence=raw.evidence+" "+RawArchiveAuditCatalog.evidenceSummary(raw.archive,raw.offset,raw.length());\n        return new Assessment(confidence,raw.name,evidence,raw.saveRisk);\n    }\n\n'+marker
          s=req(s,marker,helpers,'Raw assessment helpers')
          write(path,s)

          for path in ['src/main/java/Launcher.java','build.sh','build.bat']:
              write(path,read(path).replace('v0.6.14','v0.6.15'))

          path='README.md'
          s=read(path)
          s=s.replace('> **Current version:** v0.6.14','> **Current version:** v0.6.15')
          s=s.replace('See **[FIELD_AUDIT_v0.6.14.md](FIELD_AUDIT_v0.6.14.md)** for the current confirmed/suspected field-confidence methodology and evidence baseline.','See **[FIELD_AUDIT_v0.6.15.md](FIELD_AUDIT_v0.6.15.md)** for the current raw-archive evidence baseline. The v0.6.14 audit remains available as the previous baseline.')
          s=s.replace('## v0.6.14 tab layout','## Current tab layout')
          s=s.replace('It currently carries **2,553 field records** across **12 comparison profiles**.','It currently carries **2,546 non-overlapping field records** and **29 comparison references** after integrating the complete raw archive audit.')
          s=s.replace('### v0.6.14 confidence counts','### v0.6.14 confidence counts (historical baseline)')
          if '## v0.6.15 raw-archive audit' not in s:
              section='## v0.6.15 raw-archive audit\n\nv0.6.15 compares the complete supplied clean/original archive set directly with every supplied modded archive. The derived evidence covers 84 archive files, 78 physical modded-vs-original comparisons, 48 SHA-256-deduplicated supplied variants and 7,222 changed byte-runs.\n\nCurrent audited totals are **2,546 Base rows / 233 confirmed / 48 strong-suspected** and **350 DLC rows / 11 confirmed / 48 strong-suspected**. A key correction is that `4D C7 1C 10` is a sniper/standard-reticle-related function rather than the silencer ID; Silence To The Guns replaces it with `26 AC CD 27`, the built-in silencer function. See **[FIELD_AUDIT_v0.6.15.md](FIELD_AUDIT_v0.6.15.md)** for the evidence and promotion rules.\n\n'
              s=req(s,'## v0.6.14 field-confidence audit\n',section+'## v0.6.14 field-confidence audit\n','README raw audit section')
          s=s.replace('dist/DXMD-Archive-Editor-Pro-v0.6.14.jar','dist/DXMD-Archive-Editor-Pro-v0.6.15.jar')
          write(path,s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/RawArchiveAuditCatalog.java src/main/java/FieldConfidenceAudit.java src/main/java/Launcher.java build.sh build.bat README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize v0.6.15 raw archive audit'
            git push origin HEAD:main
          fi

      - name: Build JAR
        run: bash build.sh

      - name: Run raw-audit sanity checks
        run: |
          cat > build/AuditSanity.java <<'EOF'
          public class AuditSanity {
              public static void main(String[] args) {
                  BaseResearchProfiles.Profile base=BaseResearchProfiles.get();
                  int baseConfirmed=0,baseStrong=0;
                  for(BaseResearchProfiles.Field f:base.fields){
                      FieldConfidenceAudit.Assessment a=FieldConfidenceAudit.assessBase(f,null,"");
                      if(a.confidence==FieldConfidenceAudit.Confidence.CONFIRMED)baseConfirmed++;
                      if(a.confidence==FieldConfidenceAudit.Confidence.STRONG_SUSPECTED)baseStrong++;
                  }
                  int dlcFields=0,dlcConfirmed=0,dlcStrong=0,assault=0,classicPack=0,enforcer=0,intruder=0,tactical=0;
                  for(String name:DLCProfiles.names()){
                      DLCProfiles.Profile p=DLCProfiles.get(name);dlcFields+=p.fields.size();
                      for(DLCProfiles.Field f:p.fields){
                          FieldConfidenceAudit.Assessment a=FieldConfidenceAudit.assessDlc(name,f,"");
                          if(a.confidence==FieldConfidenceAudit.Confidence.CONFIRMED){
                              dlcConfirmed++;
                              if(name.contains("Assault"))assault++; else if(name.contains("Classic"))classicPack++; else if(name.contains("Enforcer"))enforcer++; else if(name.contains("Intruder"))intruder++; else if(name.contains("Tactical"))tactical++;
                          }
                          if(a.confidence==FieldConfidenceAudit.Confidence.STRONG_SUSPECTED)dlcStrong++;
                      }
                  }
                  if(base.fields.size()!=2546)throw new RuntimeException("Base rows "+base.fields.size());
                  if(base.referenceNames.size()!=29)throw new RuntimeException("Base refs "+base.referenceNames.size());
                  if(baseConfirmed!=233||baseStrong!=48)throw new RuntimeException("Base confidence "+baseConfirmed+"/"+baseStrong);
                  if(RawArchiveAuditCatalog.uniqueVariantCount()!=48||RawArchiveAuditCatalog.rawRunCount()!=7222)throw new RuntimeException("Raw evidence counts");
                  if(dlcFields!=350||dlcConfirmed!=11||dlcStrong!=48)throw new RuntimeException("DLC counts "+dlcFields+"/"+dlcConfirmed+"/"+dlcStrong);
                  if(assault!=2||classicPack!=1||enforcer!=2||intruder!=1||tactical!=5)throw new RuntimeException("DLC pack counts "+assault+","+classicPack+","+enforcer+","+intruder+","+tactical);
                  BaseResearchProfiles.Field reticle=null;for(BaseResearchProfiles.Field f:base.fields)if(f.offset==4887605L)reticle=f;
                  FieldConfidenceAudit.Assessment ra=FieldConfidenceAudit.assessBase(reticle,null,"");
                  if(ra.confidence!=FieldConfidenceAudit.Confidence.CONFIRMED||!ra.name.contains("Standard-Reticle"))throw new RuntimeException("Reticle correction missing");
                  DLCProfiles.Field battle=null;for(DLCProfiles.Field f:DLCProfiles.get("DLCPackAssault.layer.0.all.archive").fields)if(f.offset==54331L)battle=f;
                  if(battle==null||!FieldConfidenceAudit.isDlcConfirmed("DLCPackAssault.layer.0.all.archive",battle))throw new RuntimeException("Elite Battle width missing");
                  DLCProfiles.Field micro=null;for(DLCProfiles.Field f:DLCProfiles.get("DLCPackTactical.layer.0.all.archive").fields)if(f.offset==112348L)micro=f;
                  if(micro==null||!FieldConfidenceAudit.isDlcConfirmed("DLCPackTactical.layer.0.all.archive",micro))throw new RuntimeException("Micro gate missing");
                  DLCProfiles.Field sup=null;for(DLCProfiles.Field f:DLCProfiles.get("DLCPackEnforcer.layer.0.all.archive").fields)if(f.offset==31593120L)sup=f;
                  if(sup==null||FieldConfidenceAudit.assessDlc("DLCPackEnforcer.layer.0.all.archive",sup,"").confidence!=FieldConfidenceAudit.Confidence.STRONG_SUSPECTED)throw new RuntimeException("Suppressor confidence regressed");
                  System.out.println("Raw audit OK: Base="+base.fields.size()+" C="+baseConfirmed+" SS="+baseStrong+", variants="+RawArchiveAuditCatalog.uniqueVariantCount()+" runs="+RawArchiveAuditCatalog.rawRunCount()+", DLC="+dlcFields+" C="+dlcConfirmed+" SS="+dlcStrong);
              }
          }
          EOF
          javac --release 11 -cp build/classes -d build/classes build/AuditSanity.java
          java -cp build/classes AuditSanity
          rm -f build/classes/AuditSanity.class build/AuditSanity.java

      - name: Smoke-check JAR contents
        run: |
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.15.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^Launcher.class$'
          jar tf "$JAR" | grep -q '^FieldConfidenceAudit.class$'
          jar tf "$JAR" | grep -q '^RawArchiveAuditCatalog.class$'
          jar tf "$JAR" | grep -q '^BaseFieldsPanel.class$'
          jar tf "$JAR" | grep -q '^DLCEditorPanel.class$'
          jar tf "$JAR" | grep -q '^raw_archive_evidence.tsv.gz.b64$'
          jar tf "$JAR" | grep -q '^dlc_profiles.tsv.gz.b64$'
          jar tf "$JAR" | grep -q '^base_research_v069_patch.tsv.gz.b64$'
          sha256sum "$JAR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXMD-Archive-Editor-Pro-v0.6.15
          path: dist/DXMD-Archive-Editor-Pro-v0.6.15.jar
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.6.15'
          JAR='dist/DXMD-Archive-Editor-Pro-v0.6.15.jar'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'DXMD Archive Editor Pro v0.6.15' --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target main --title 'DXMD Archive Editor Pro v0.6.15' --notes-file RELEASE_NOTES.md
          fi
